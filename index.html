)", "explanation": "正答。\n半水生のカメは水中に隠れるのでシェルターが不要である。\nトカゲはヘビとともに有鱗目に属する。\nガビアル科を加えて3つに分類される。\nウミガメは陸で産卵する。", "supplement": "超要約：正答。 半水生のカメは水中に隠れるのでシェルターが不要である。 トカゲはヘビとともに有鱗目に属する。 覚え方：『爬虫類→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 100, "problem": "カメに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 3, "text": "(2級教本第7編第4章第5節）参照。"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "曲頸亜目のカメのほうが首が長く、首を引っ込めても頭を収納できないので、首を横に曲げて頭を保護する。\n半水生種の多くの種類は水中で排泄する。\n正答。\n半水生種のカメは雑食性である。\nカメはすべて卵生である。", "supplement": "超要約：曲頸亜目のカメのほうが首が長く、首を引っ込めても頭を収納できないので、首を横に曲げて頭を保護する。 半水生種の多くの種類は水中で排泄する。 正答。 覚え方：『記述→曲頸亜目』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 101, "problem": "トカゲに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 2, "text": "(2級教本第7編第4章第5節）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "グリーンイグアナは、大型で草食性である。\n正答。\nヤモリには動かせるまぶたがなく、目は透明な鱗におおわれている。\n飼養下のトカゲは肥満しやすい傾向にあるので、食事の回数は1日に1~2回にする。\nトカゲには、卵胎生の種と卵生の種がいる。", "supplement": "超要約：グリーンイグアナは、大型で草食性である。 正答。 ヤモリには動かせるまぶたがなく、目は透明な鱗におおわれている。 覚え方：『トカゲ→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 102, "problem": "ヘビに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 4, "text": "(2級教本第7編第4章第5節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "ヘビの目にはまぶたがなく、透明な鱗におおわれている。\nボア科のほとんどが卵胎生で、ニシキヘビ科のほとんどが卵生である。\nアオダイショウは、ナミヘビ科に属する。\n正答。\n⑤ヘビの交尾はトカゲより長く、数時間に及ぶこともある。", "supplement": "超要約：ヘビの目にはまぶたがなく、透明な鱗におおわれている。 ボア科のほとんどが卵胎生で、ニシキヘビ科のほとんどが卵生である。 アオダイショウは、ナミヘビ科に属する。 覚え方：『記述→透明』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 103, "problem": "動物の基本的な取り扱いに関する次の記述のうち、正しいものをlつ選びなさい。", "choices": [{"no": 1, "text": "犬にとって散歩は、運動やストレス発散のためだけのものであり、人間社会にとけ込むためのものではない。"}, {"no": 2, "text": "運動は、筋力や耐久力を保つために重要なので、たとえ病気であっても毎日運動が必要である。"}, {"no": 3, "text": "雌猫は、肛門のすぐ下側に外尿道口があるので、下痢で外陰部が汚染されると膀胱炎になりやすいので注意が必要である。"}, {"no": 4, "text": "猫は一般的に環境の変化を好み、毎日同じスケジュールで過ごすことを好まない。"}, {"no": 5, "text": "猫がトイレ以外で排泄するのは、精神的ストレスだけが原因なので、身体的病気の可能性はない。\n【正答】"}, {"no": 3, "text": "(2級教本第7編第5章）参照。"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "(1)犬にとって散歩は、運動やストレス発散のためだけでなく、人間社会を学び人間社会にとけ込む基礎をつくる。\n(2)運動は、筋力や耐久力を保つために重要であるが、病気のときは安静が必要である。\n(3)正答。\n(4)猫は一般的に変化を嫌い、毎日同じスケジュールで過ごすことを好む。\n(5)猫がトイレ以外で排泄するのは、精神的ストレスだけが原因とは限らないので、身体的な病気の可能性も考慮する必要がある。", "supplement": "超要約：(1)犬にとって散歩は、運動やストレス発散のためだけでなく、人間社会を学び人間社会にとけ込む基礎をつくる。 (2)運動は、筋力や耐久力を保つために重要であるが、病気のときは安静が必要である。 (3)正答。 覚え方：『基本的→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 104, "problem": "動物の栄養と食事に関する次記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "炭水化物は、糖質と食物繊維に分かれ、どちらも動物のもつ消化酵素で消化される。"}, {"no": 2, "text": "たんぱく質は、筋肉や皮膚、被毛、骨、血管や臓器など体を構成する成分となるが、酵素、抗体やホルモンなどの物質はたんぱく質の成分ではない。"}, {"no": 3, "text": "脂質は効率の良いエネルギー源で、たんぱく質や糖質が作るエネルギーと比べると約2倍のエネルギーを作り出す。"}, {"no": 4, "text": "ミネラルは、動物にとって必須であるが、この欠乏はエネルギーの欠乏のように死に至ることはない。"}, {"no": 5, "text": "すべてのビタミンは、動物体内で作られる。\n【正答】"}, {"no": 3, "text": "(2級教本第7編第6章第2節）参照。"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "(1)食物繊維は、消化酵索では消化されない。\n(2)たんばく質の役割は、大きく分けると二つあり、一つは体を構成する成分となる働きで、筋肉や皮膚、被毛、骨、血管や臓器などのもととなり、もう一つは体内でさまざまに機能する成分となる働きで、酵索や抗体、ホルモンなどの物質になる。\n(3)正答。\n(4)ミネラルの欠乏は、エネルギーの欠乏よりも早く死をもたらす。\n(5)体内では作られないビタミンもあり、食べ物から摂取する必要がある。", "supplement": "超要約：(3)正答。 覚え方：『栄養→食事』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 105, "problem": "犬の食事管理について述べた次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "犬の食事は、楽しく遊びながら、十分な時間をかけて与えるとよい。"}, {"no": 2, "text": "母犬の母乳が出ない場合や足りない場合には人工哺乳が必要となる。"}, {"no": 3, "text": "運動量の少なくなった高齢犬には、高カロリー、高脂肪の食事を与える必要がある。"}, {"no": 4, "text": "犬にとってタマネギ、長ネギ、ニラやニンニクには強い血栓予防作用があるので積極的に与えるようにする。"}, {"no": 5, "text": "犬の水分摂取量は少量であるため、与えすぎないように注意する。\n【正答】"}, {"no": 2, "text": "(2級教本第7編第6章第5節）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "(1)犬の食事は、適贔を与え偏食をさせないように注意し、遊び食いをさせないため食事時間は長くて15分ほどにし、食事中は気をそらさないように食事に集中させる。\n(2)正答。\n(3)高齢犬には低カロリー、低脂肪で、消化しやすい食事を与える。\n(4)犬にとってネギ類（タマネギや長ネギ）、ニラやニンニクは、赤血球中のヘモグロビンを変化させる成分を含んでいる。個体によっては少量を食べただけでも赤血球が破壊されてしまうことがあり、貧血の原因となるので与えないようにする。\n(5)犬がつねに水を飲めるようにし、1日に何回か取り替えて、新鮮な水を与えるようにする。", "supplement": "超要約：(1)犬の食事は、適贔を与え偏食をさせないように注意し、遊び食いをさせないため食事時間は長くて15分ほどにし、食事中は気をそらさないように食事に集中させる。 (2)正答。 覚え方：『食事管理→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 106, "problem": "猫の食事管理に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "必要な栄養素に変わりはないので、猫に犬用のフードを与えてもよい。"}, {"no": 2, "text": "肥満猫には、カロリーが高く食物繊維の少ないフードを与える。"}, {"no": 3, "text": "子猫の離乳食としては、子猫専用のキャットフードを湯でふやかして、1日に3~4回に分けて与える。"}, {"no": 4, "text": "猫はピタミンAをβカロテンから合成できる。"}, {"no": 5, "text": "猫は出された食事をすぐに食べきるので、1日分の食事を一度に与える。\n【正答】"}, {"no": 3, "text": "(2級教本第7編第6章第5節）参照。"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "(1)猫に犬用のフードは与えてはいけない。犬用のフードには、猫に必要なたんぱく質やビタミン類、必須アミノ酸であるタウリンが充分量含有されていない危険性がある。\n(2)）肥満猫にはカロリーが少なく、食物繊維の多いフードを与える。\n(3)正答。\n(4)猫は、ビタミンAをβカロテンから合成できない。\n(5)猫は1日分の食事の量を一度に出してもすぐに食べきらないので、1日分の食事の量を2〜3回に分けて与える。", "supplement": "超要約：(3)正答。 (5)猫は1日分の食事の量を一度に出してもすぐに食べきらないので、1日分の食事の量を2〜3回に分けて与える。 覚え方：『食事管理→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 107, "problem": "高齢動物の取り扱いに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "犬や猫の平均寿命（平均死亡年齢）が延びたことと、感染症予防や室内飼育が普及したこととは関係がない。"}, {"no": 2, "text": "一般に老化の兆候として、五感の衰え、内臓機能の低下、筋骨格の衰えがみられ、免疫力が低下し、感染症などにかかりやすくなる。"}, {"no": 3, "text": "高齢期の犬は、散歩に行きたがったとしても外出を伴う散歩はやめたほうがよい。"}, {"no": 4, "text": "高齢期の猫には、運動能力が保てるようにキャットタワーの段差を大きくしてあげるとよい。"}, {"no": 5, "text": "高齢の猫では、甲状腺ホルモンが減少する甲状腺機能亢（こう）進症という病気が認められることがあり、不活発になり食欲が減退する。\n【正答】"}, {"no": 2, "text": "(2級教本第7編第7章第1~3節）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "(1)感染症予防や室内飼育が普及したことなどにより、犬も猫も総じて長生きできるようになった。\n(2)正答。\n(3)散歩好きの犬にとっては、外出は気分転換であり、脳を活性化させる良い刺激になるため、行きたがっているうちは外に連れ出すとよい。\n(4)高齢期の猫には、キャットタワーやトイレは段差の少ないものを用意する。\n(5)高齢の猫では、甲状腺ホルモンが過剰に分泌される甲状腺機能亢進性という病気が認められることがある。この場合、活発になり食欲が旺盛になるが、痩せてくる。", "supplement": "超要約：(2)正答。 (3)散歩好きの犬にとっては、外出は気分転換であり、脳を活性化させる良い刺激になるため、行きたがっているうちは外に連れ出すとよい。 覚え方：『持ち込まない・広げない』。経路と対策（隔離/消毒/報告）をセットで。"}, {"q": 108, "problem": "高齢動物の取り扱いに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "ウサギが高齢になったら、ケージ内のレイアウトを大幅に変更しなければいけない。"}, {"no": 2, "text": "高齢期のウサギは、被毛の色素が失われて白くなり、基礎代謝量が減る。"}, {"no": 3, "text": "高齢期の鳥では筋胃の力が弱くなるため、より硬い鉱物飼料をできるだけ多く与えなければいけない。"}, {"no": 4, "text": "高齢期の鳥では、若い鳥のような換羽期の栄養管理は必要なくなる。"}, {"no": 5, "text": "高齢期のカメの甲羅の維持には、カルシウムは必要ない。\n【正答】"}, {"no": 2, "text": "(2級教本第7編第7章第4~6節）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "(1)ウサギが高齢になってからケージ内レイアウトを変更すると、トイレのしつけが崩れてしまうことがあるので、大幅なレイアウトの変更はやめたほうがよい。\n(2)正答。\n(3)鳥は高齢になると筋胃の力が弱くなるため、硬い鉱物飼料を与え続けていると、胃の負担になってしまう。高齢期の鳥には、軟らかい鉱物飼料を与えるとよい。\n(4)換羽期は、若い鳥であっても体調が悪くなりやすいため、高齢であればなおさら温度管理に注意し、体調に気を配りながら羽毛が生え始めるタイミングで高たんぱくのペレットに変えたり、種子類で飼っている場合にはアミノ酸サプリメントを添加したりするとよい。\n(5)高齢期のカメの甲羅が健康に維持されるには、カルシウムとリン、ビタミンの3つが必要不可欠な栄養素である。", "supplement": "超要約：(2)正答。 (3)鳥は高齢になると筋胃の力が弱くなるため、硬い鉱物飼料を与え続けていると、胃の負担になってしまう。高齢期の鳥には、軟らかい鉱物飼料を与えるとよい。 (4)換羽期は、若い鳥であっても体調が悪くなりやすいため、高齢であればなおさら温度管理に注意し、体調に気を配りながら羽毛が生え始めるタイミングで高たんぱくのペレットに変えたり、種子類で飼っている場合にはアミノ酸サプリメントを添加したりするとよい。 覚え方：『高齢動物→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 109, "problem": "日本人とペットの歴史に関する次の記述のうち、最も妥当なものを1つ選びなさい。", "choices": [{"no": 1, "text": "日本に犬はいなかったが、江戸時代の中期に朝鮮半島から入ってきたといわれている。"}, {"no": 2, "text": "犬は、主に狩猟に使う目的で飼養され始めたが、猫は、ネズミ退治のために飼養され始めたといわれている。"}, {"no": 3, "text": "犬は昭和時代から、猫は明治時代から、庶民の間における飼養が普及し始めたといわれている。"}, {"no": 4, "text": "江戸時代には鳥の飼育が流行して複数の飼育書が出版されるなどしたが、現在は、犬や猫に比べて飼育率が低くなっている。"}, {"no": 5, "text": "犬や猫を室内で飼う割合は、江戸時代の後半に急速に増えて現在に至っている。\n【正答】"}, {"no": 4, "text": "(2級教本第8編第1章第1節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "(1)犬は、縄文時代には既に日本に入ってきていた。\n(2)世界的には、犬は狩猟や番犬、猫はネズミ退治が目的であったといわれている。日本では、犬は狩猟や番犬、猫は愛玩が目的で飼養され始めたと考えられている。\n(3)犬は江戸時代中期ごろから、猫は室町時代ごろから飼養が普及し始めたと考えられている。\n(4)正答。\n(5)昭和50年代～60年代ごろから増え始めた。", "supplement": "超要約：(4)正答。 覚え方：『日本人→ペット』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 110, "problem": "動物観に関する次の記述のうち、最も妥当なものを1つ選びなさい。", "choices": [{"no": 4, "text": "(2級教本第8編第1章第2~4節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "(1)間違って動物を踏みつけないためだといわれている。\n(2)日本の昔話では、西洋と比べて、動物が人に化けるなどといった事例が多く見受けられる。これは、西洋と異なり、日本では人と動物とは同格の関係にあると考えられている傾向が強いためであるといわれている。\n(3)動物観は、宗教や風土などの影響により、世界各地で異なるほか、人によっても異なる。また、時代の変化にも左右されるものである。\n(4) 正答。\n(5)旧約聖書『創世記』においては、創造主である神がすべての生き物を創った後に神自らの形に似せて人間を作り、動物を支配することを許し、大洪水（ノアの洪水）後、肉食を許したとされる。", "supplement": "超要約：(1)間違って動物を踏みつけないためだといわれている。 (2)日本の昔話では、西洋と比べて、動物が人に化けるなどといった事例が多く見受けられる。これは、西洋と異なり、日本では人と動物とは同格の関係にあると考えられている傾向が強いためであるといわれている。 (4) 正答。 覚え方：『動物観→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 111, "problem": "西欧の動物観に関する次の記述のうち、最も妥当なものを1つ選びなさい。", "choices": [{"no": 1, "text": "アルベルト・シュヴァイツァーは、「動物も痛みや苦しみを感じることができるのだから、正しくあろうとするならば、動物が痛みや苦しみを受けないようにしなければならない」と主張した。"}, {"no": 2, "text": "トマス・アクイナスは、動物は人のための資源であると考えて「不完全なもの（動物など）は完全なもの（人間）のために存在する」と主張した。"}, {"no": 3, "text": "ジェレミー・ベンサムは、「生命への畏敬の理念」を現代人類の思想の中に導き入れ、生きとし生けるもの（動物を含む）への倫理の拡大を主張した。"}, {"no": 4, "text": "）レネ・デカルトは、理性を最高原理として生き物などを序列づけし、「理性的に劣ったもの（人間以外の動物）は優れているもの（人間）のために存在する」と主張した。"}, {"no": 5, "text": "アリストテレスは、「動物」は理性のない「自動機械」であるから、苦痛など感じていないと主張した。\n【正答】"}, {"no": 2, "text": "(2級教本第8編第1章第4節）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "(1)ジェレミー・ベンサムの主張。\n(2)正答。\n(3)アルベルト・シュヴァイツァーの主張。\n(4)アリストテレスの主張。\n(5)ルネ・デカルトの主張（動物機械論）。", "supplement": "超要約：(2)正答。 覚え方：『西欧→動物観』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 112, "problem": "「人と動物の関係学」に関する次の記述のうち、最も妥当なものを1つ選びなさい。", "choices": [{"no": 1, "text": "ぺット・パートナーズ（旧・デルタ協会）は、動物愛護のボランティア活動に関する国際交流を目的とした学術団体のことである。"}, {"no": 2, "text": "ボリス・レビンソンは、人の精神療法に動物の力を活用することは好ましくないという学説を発表した獣医師である。"}, {"no": 3, "text": "ヒューマン・アニマル・ボンドとは、愛玩動物として人が動物を飼いやすく訓練する手法のことである。"}, {"no": 4, "text": "人と動物の関係学は、獣医学、社会学、心理学、教育学、歴史学、文化人類学、動物福祉などのほか、動物観研究など、さまざまな分野からの研究が行われている。"}, {"no": 5, "text": "人と動物の関係学が調査研究の対象としている「人と動物の関係」は、動物をペットとして飼養することに限定されており、畜産利用は対象外であるとされている。\n【正答】"}, {"no": 4, "text": "(2級教本第8編第1章第6節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "(1)人間と動物や環境の相互作用に関する教育研究活動を行うアメリカの団体である。なお、人と動物の双方の利益になる相互作用の正しい理解の促進と国際交流を目的とした学術団体は、「IAHAIO（人と動物の関係に関する国際会議）」である。\n(2)人の精神療法に動物の力を活用できることを発表したアメリカの臨床心理学者である。\n(3)人と動物の絆のことである。\n(4)正答。\n(5)動物の畜産利用も人と動物の関係学の対象の一つである。", "supplement": "超要約：(4)正答。 覚え方：『関係学→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 113, "problem": "次の記述のうち、意図的ではないとしても動物虐待につながるおそれが最も高くなる場合があると考えられる行為を1つ選びなさい。", "choices": [{"no": 2, "text": "(2級教本第8編第2章第1節）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "虐待には、意図的・積極的な虐待とネグレクト（飼養放棄）という虐待の2種類がある。「動物の愛護及び管理に関する法律」の施行規則の第12条の2では、虐待のおそれがある事態を以下の1)〜6)のとおりとしている。選択肢は以下の6)に該当する。\n1)動物の鳴き声が過度に継続して発生し、又は頻繁に動物の異常な鳴き声が発生していること、2)動物の飼養又は保管に伴う飼料の残さ又は動物のふん尿その他の汚物の不適切な処理又は放置により臭気が継続して発生していること、3)動物の飼養又は保管により多数のねずみ、はえ、蚊、のみその他の衛生動物が発生していること、4)栄養不良の個体がみられ、動物への給餌及び給水が一定頻度で行われていないことが認められること、5)爪が異常に伸びている、体表が著しく汚れている等の適正な飼養又は保管が行われていない個体が見られること、6)繁殖を制限するための措置が講じられず、かつ、譲渡し等による飼養頭数の削減が行われていない状況において、繁殖により飼養頭数が増加していること。", "supplement": "【ストーリー】動物愛護管理法は“飼い主の教科書”。虐待を止めて、ちゃんと飼って、人と動物が仲良く暮らすための基本ルール。家庭動物の話はまずこの法律に戻る。"}, {"q": 114, "problem": "高齢者が動物を飼うことが難しくなる理由に関する次の記述のうち、あてはまらないものを1つ選びなさい。", "choices": [{"no": 2, "text": "(2級教本第8編第2章第3節）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "高齢者にとって最も大きなペット飼育へのハードルとなるのは、経済力や身体能力の低下によって面倒が見られなくなるのではないかという不安、および施設などへの入所や自らの死などによって、ペットが残されてしまうかもしれないという心配である。", "supplement": "超要約：高齢者にとって最も大きなペット飼育へのハードルとなるのは、経済力や身体能力の低下によって面倒が見られなくなるのではないかという不安、および施設などへの入所や自らの死などによって、ペットが残されてしまうかもしれないという心配である。 覚え方：『高齢者→理由』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 115, "problem": "「動物は人間にとって環境のバロメーターとなっていた」という説の説明として正しいものを、次の記述のうち1つを選びなさい。", "choices": [{"no": 1, "text": "人のそばにいる動物の動作が、天気予報の代わりになっていた。"}, {"no": 2, "text": "人間と動物が一緒に暮らすことによって、互いのふれあい欲求を満たすことができた。"}, {"no": 3, "text": "動物の排泄物は、農作物を育てる肥料として役立っていた。"}, {"no": 4, "text": "人間は、動物が安心している姿を見ることによって、その環境には自分にとっても脅威となるものがないことを察知し、気分を落ち着かせることができた。"}, {"no": 5, "text": "動物が人を見て逃げ出す姿は、人間が動物よりも強い存在であることを伝える指標となっていた。\n【正答】"}, {"no": 4, "text": "(2級教本第8編第3章第1節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "原始の時代から人間にとって動物は環境のバロメーターとなっていたと考えられる。動物が落ち着いている姿は、その環境には脅威となるものがないことを示す指標であり、そこにいる人間を安心させることができたと考えられている。", "supplement": "超要約：原始の時代から人間にとって動物は環境のバロメーターとなっていたと考えられる。動物が落ち着いている姿は、その環境には脅威となるものがないことを示す指標であり、そこにいる人間を安心させることができたと考えられている。 覚え方：『人間→環境』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 116, "problem": "動物とのふれあい・教育活動に関する次の記述のうち、最も妥当なものを1つ選びなさい。", "choices": [{"no": 3, "text": "(2級教本第8編第3章第2節）参照。"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "(1)動物介在教育とは、アニマル・アシステッド・エデュケーション(AAE)のことで、学校飼育動物による教育もその一つである。アニマル・アシステッド・アクテイビティ(AAA)は、動物介在活動のことである。\n(2)動物介在療法は、人の心身機能の回復治療が目的である。なお、医療やリハビリテーションなどの専門家の指導のもとで、動物の福祉に配慮して行うことが求められる。\n(3)正答。\n(4)ペット・パートナーズ（旧デルタ協会）は、人と動物の相互作用に関する研究や実践方法の検討をするための組織である。家庭環境などに問題がある子どもたちの教育のために、施設内にある農場で飼育している動物の世話をさせる活動を行っている施設は、グリーン・チムニーズという農場学校が有名である。\n(5)「IAHAIO（人と動物の関係に関する国際会議）」は、適した動物としては、犬や猫などをあげている一方、イルカ、ゾウ、サル、プレーリードッグ、爬虫類などの野生種は使用すべきではないとしている。", "supplement": "超要約：(3)正答。 (4)ペット・パートナーズ（旧デルタ協会）は、人と動物の相互作用に関する研究や実践方法の検討をするための組織である。家庭環境などに問題がある子どもたちの教育のために、施設内にある農場で飼育している動物の世話をさせる活動を行っている施設は、グリーン・チムニーズという農場学校が有名である。 覚え方：『教育活動→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 117, "problem": "動物介在介入に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "人気のある希少な野生動物は環境教育に役立つので、積極的に活用するべきである。"}, {"no": 2, "text": "臆病な犬でも咬みつくことがなければ、活動適性があると判断できる。"}, {"no": 3, "text": "ウサギやモルモットなどの小動物は、どのような個体であっても活用することが可能である。"}, {"no": 4, "text": "訓練されて指示に従うことができる犬であっても、他人と接することを好むなどの性格的適正がなければ、必ずしも活動適性があると判断することはできない。"}, {"no": 5, "text": "マテやフセなどのしつけ訓練ができていることが必要不可欠であるため、犬以外の動物は活用すべきではない。\n【正答】"}, {"no": 4, "text": "(2級教本第8編第3章第3節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "動物介在のさまざまな現場に連れていく犬を求めるときには、行動管理が十分であるということのみならず、他者と接することを好む社会性に富んだ性格的適正があることの確認が必要である。またウサギやモルモットのような小動物でも性格的に向いている個体を選ぶべきであり、リスク管理の観点から野生種は絶対に用いるべきではない。", "supplement": "超要約：動物介在のさまざまな現場に連れていく犬を求めるときには、行動管理が十分であるということのみならず、他者と接することを好む社会性に富んだ性格的適正があることの確認が必要である。またウサギやモルモットのような小動物でも性格的に向いている個体を選ぶべきであり、リスク管理の観点から野生種は絶対に用いるべきではない。 覚え方：『動物介在介入→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 118, "problem": "子どもと動物の関係や学校における動物の飼育に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "(2級教本第8編第3章第5~6節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "動物との接触は幼い子どもの非言語的コミュニケーション能力を伸ばし、周囲の人間とのコミュニケーションにも効果をもたらす。", "supplement": "超要約：動物との接触は幼い子どもの非言語的コミュニケーション能力を伸ばし、周囲の人間とのコミュニケーションにも効果をもたらす。 覚え方：『関係→学校』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 119, "problem": "ペット飼養を支える適正な環境づくりに関する次の記述のうち、最も妥当なものを1つ選びなさい。", "choices": [{"no": 1, "text": "ペットの適正飼養を実現するためには、飼い主が適正飼養に関する知識を身につけるだけでなく、ペットと暮らす環境についても適切なものにする必要がある。"}, {"no": 2, "text": "環境省が作成した「住宅密集地における犬猫の適正飼養ガイドライン」は、住宅密集地における野良犬や野良猫による被害の防止を主目的としたガイドラインである。"}, {"no": 3, "text": "ペット可マンションに比べて、ペット共生マンションのほうが、ペットトラプルが発生しやすい傾向がある。"}, {"no": 4, "text": "賃貸のペット共生マンションでは、ペットや飼い主についての入居審査を行う物件はない。"}, {"no": 5, "text": "社団法人日本愛玩動物協会が実施している「ペット共生住宅の適正化推進プロジェクト」は、「ペットの飼育率の増加」「子どもがペットとふれあう機会の増加」「ペットのしつけの普及」の3つを柱としている。\n【正答】"}, {"no": 1, "text": "(2級教本第9編第1章）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "(1)正答。\n(2)人と犬や猫が調和した快適な居住環境の維持向上、人と犬や猫が共生できる街づくりを図るための基本的な配慮事項等をまとめたガイドラインである。\n(3)ペット共生マンションのほうが、ペットトラプルが発生しにくい傾向にある。\n(4)賃貸のペット共生マンションでは、ペットや飼い主についての入居審査を行う物件がある。\n(5)「住環境の整備」「ペットと暮らす環境の適正化に必要不可欠である飼い主のマナーの普及・啓発」「ペット共生住宅に関わる人材の育成」の3つを柱としている。", "supplement": "【語呂/ストーリー】『環境』は自然や生き物のルール担当。動物愛護管理もここ。迷ったら『動物愛護＝環境省』で固定。"}, {"q": 120, "problem": "住まいにおけるペットの飼育環境に関する次の記述のうち、最も妥当なものを1つ選びなさい。", "choices": [{"no": 1, "text": "飼育環境に必要なものはペットのライフステージや状況に応じて変化していくものなので、最初からつくり込みすぎずに柔軟性・可塑性をもたせた環境づくりを心がける必要がある。"}, {"no": 2, "text": "マンションでの居住者間トラプルにおいて、「3大ペットトラプル」といわれているのは、「無駄吠え」「悪臭」「逸走（いっそう）」である。"}, {"no": 3, "text": "近年の傾向として、ペットが快適に過ごすことができるように、飼い主のライフスタイルやニーズに制限をかけた住環境づくりに目が向けられるようになってきている。"}, {"no": 4, "text": "「ペット可集合住宅」とはペット飼育ができる賃貸型マンション、「ペット共生集合住宅」とはペット飼育ができる分譲型マンションのことである。"}, {"no": 5, "text": "ペットと暮らす住環境で重要なのは、ペットの本来の行動に制限をかけて家具などが傷むことを防ぎ、近隣に迷惑をかけないようにすることである。\n【正答】"}, {"no": 1, "text": "(2級教本第9編第1章）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "(1)正答。\n(2)「3大ペットトラプル」とは、「無駄吠え」「悪臭」「不衛生」である。\n(3)近年は「ペットと幸せに暮らす」ための住環境に目が向けられており、飼い主とペットが「ともに快適に暮らすための方法論」が重要視されている。\n(4)「ペット可集合住宅」とは単にペットを飼育してもよいと認められているタイプの住まい、「ペット共生集合住宅」とはペット飼育を目的として設計された住まいをいう。いずれも分譲、賃貸の両方がある。\n(5)ペットと暮らす住環境で重要なのは、行動に制限をかけるのではなく、ペットの習性をきちんと理解したうえで、本来の行動を引き出せるような環境づくりをすることである。", "supplement": "超要約：(1)正答。 (3)近年は「ペットと幸せに暮らす」ための住環境に目が向けられており、飼い主とペットが「ともに快適に暮らすための方法論」が重要視されている。 (5)ペットと暮らす住環境で重要なのは、行動に制限をかけるのではなく、ペットの習性をきちんと理解したうえで、本来の行動を引き出せるような環境づくりをすることである。 覚え方：『ペット→飼育環境』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 121, "problem": "ペットツーリズムに関する次の記述のうち、最も妥当なものを1つ選びなさい。", "choices": [{"no": 2, "text": "(2級教本第9編第2章）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "(1)ペットと一緒に開放的な空間でのびのび遊んだり、非日常的な想い出づくりをしたいというニーズが高く、現時点ではリゾート型のペット同伴宿泊施設が多い。\n(2)正答。\n(3)ご世界で最初のドッグランは、1991年にニューヨーク州のセントラルパークに設置されたものだといわれている。\n(4)飼い主とペットを受け入れるためには、ハード面の整備はもちろんのこと、その動物の習性や生理に関する知識も習得したうえでの対応が必要となる。\n(5)外出には向き不向きがあり、子犬や高齢犬ではストレスがかかり体調を崩すこともあるので、慎重に行うことが重要である。", "supplement": "超要約：(2)正答。 (4)飼い主とペットを受け入れるためには、ハード面の整備はもちろんのこと、その動物の習性や生理に関する知識も習得したうえでの対応が必要となる。 覚え方：『ペットツーリズム→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 122, "problem": "ペットツーリズムに関する次の記述のうち、最も妥当なものを1つ選びなさい。", "choices": [{"no": 1, "text": "飼い主とペットが外出をすることは、しつけの重要性や社会化の必要性を再確認する有効な機会になる。"}, {"no": 2, "text": "ペットを電車に乗せる場合、JRでは「縦・横・高さの合計が200cm以内の動物専用のケースに入れたもの、ケースと動物を合わせた重さが20kg以内のもの」としている。"}, {"no": 3, "text": "ペットをマイカーに乗せるときはハードタイプのクレートに入れ、運転者の目の行き届く助手席に乗せるほうが安心だといわれている。"}, {"no": 4, "text": "ドッグカフェでは、床にペットシーツを敷き、足元に座らせるのがマナーである。"}, {"no": 5, "text": "犬は人と比べると平衡感覚が鈍いため、車酔いしにくいといわれている。\n【正答】"}, {"no": 1, "text": "(2級教本第9編第2章）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "(1)正答。\n(2)JRでは、電車にペットを乗せる場合の規定として、「縦・横・高さの合計が120cm以内の動物専用のケースに入れたもの、ケースと動物を合わせた重さが10kg以内のもの」としている。\n(3)ペットはハードタイプのクレートに入れ、後部座席に乗せてシートベルトで固定する。膝の上に座らせて運転することは「危険運転」とみなされて、道路交通法違反に問われることもある。\n(4)ペットシーツを敷くと、犬がそこをトイレと認識して店内で排泄してしまう可能性があるので、ペットシーツではなくカフェマットを敷くのがマナーとされる。\n(5)犬は人に比べると平衡感覚が優れていて、振動や揺れにも敏感に反応するため、車酔いしやすいといわれている。", "supplement": "超要約：(1)正答。 (4)ペットシーツを敷くと、犬がそこをトイレと認識して店内で排泄してしまう可能性があるので、ペットシーツではなくカフェマットを敷くのがマナーとされる。 (5)犬は人に比べると平衡感覚が優れていて、振動や揺れにも敏感に反応するため、車酔いしやすいといわれている。 覚え方：『ペットツーリズム→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 123, "problem": "動物の愛護及び管理に関する法律に規定された動物愛護管理センターに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "「動物愛護管理センター」という施設名称は法律で規定されたものではない。"}, {"no": 2, "text": "第一種動物取扱業の登録は業務とされているが、第二種動物取扱業の届出は業務から除外されている。"}, {"no": 3, "text": "動物の愛護及び管理に関する広報やその他の啓発活動は、業務とされている。"}, {"no": 4, "text": "特定動物の飼養または保管の許可は、業務とされていない。"}, {"no": 5, "text": "猫の引き取りや譲渡は、業務とされていない。\n【正答】"}, {"no": 3, "text": "(2級教本第9編第3章第1~3節）参照。"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "(1)2019（令和元）年の動物愛護管理法改正で、施設名を動物愛護管理センターとすることが法律に明記された。\n(2)動物愛護管理センターでは、第一種動物取扱業の登録、第二種動物取扱業の届出を受け付けている。\n(3)正答。\n(4)特定動物の飼養または保管の許可は業務とされている。\n(5)犬や猫の引き取りや譲渡は業務とされている。", "supplement": "【ストーリー】動物愛護管理法は“飼い主の教科書”。虐待を止めて、ちゃんと飼って、人と動物が仲良く暮らすための基本ルール。家庭動物の話はまずこの法律に戻る。"}, {"q": 124, "problem": "動物の保護収容施設に関する次の記述のうち、最も妥当なものを1つ選びなさい。", "choices": [{"no": 1, "text": "「シェルターメデイスン」とは、動物愛護管理センターや民間のアニマルシェルターに勤務するスタッフの精神面をケアサポートすることである。"}, {"no": 2, "text": "野生動物の保護収容を行うために環境省が整備している「野生生物保護センター」は、各都道府県に設置されている。"}, {"no": 3, "text": "「保護猫カフェ」とは、保護猫を販売した売上げを譲渡活動にあてている飲食店のことである。"}, {"no": 4, "text": "動物の保護収容施設は、収容された動物が生涯、そこで生活することを目的とした飼育施設である。"}, {"no": 5, "text": "災害時の避難所でのペットの飼育場所は、人とペットが同じ空間で過ごせる「同居型」と、別々に過ごす「別居型」に分けられる。\n【正答】"}, {"no": 5, "text": "(2級教本第9編第4章）参照。"}], "answer_no": 5, "answer_raw": "(5)", "explanation": "(1)「シェルターメデイスン」は、動物保護収容施設で暮らす動物に特化した獣医療で、獣医学と動物福祉の観点から、病気になりにくい衛生管理やストレスの少ない環境づくりを行い、保護している動物を心身ともに健康な状態にすることを目的としている。\n(2)環境省の「野生生物保護センター」は、全国8カ所に設置されている。\n(3)「保護猫カフェ」とは、保護猫とのふれあいと新しい飼い主探しを融合させた、新しいスタイルの保護収容施設である。\n(4)保護収容施設はあくまでも「一時的な生活場所」であり、近年は新しい飼い主との出会いを提供する譲渡施設としての役割が強い。災害時に開設される施設も、いずれは閉鎖されるのが一般的である。\n(5)正答。", "supplement": "【語呂/ストーリー】『環境』は自然や生き物のルール担当。動物愛護管理もここ。迷ったら『動物愛護＝環境省』で固定。"}, {"q": 125, "problem": "ペットの教育・訓練施設に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "犬のしつけ教室では「プライベートレッスン」が主流である。"}, {"no": 2, "text": "パピーパーティーは単発のしつけ教室であることが多いので、場合によっては、ほかの犬に対して恐怖心・警戒心を増幅するだけで終わってしまうことがある。"}, {"no": 3, "text": "パピークラスでは、主に3歳までの犬を対象に、社会化や基本的なしつけを指導することが多い。"}, {"no": 4, "text": "ドッグトレーナーは犬をトレーニングする知識や技術よりも、飼い主に分かりやすく伝えるコミュニケーション能力のほうが必要とされている。"}, {"no": 5, "text": "盲導犬・聴導犬・介助犬などの補助犬を育成する人は獣医師でなければならない。\n【正答】"}, {"no": 2, "text": "(2級教本第9編第5章）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "(1)しつけ教室では「グループレッスン」が主流である。\n(2)正答。単発で終わるパピーパーティーでは、恐怖心や警戒心を覚えてしまったら、それを克服する機会が与えられないことがあるので、パピークラスにも参加して継続的に社会化することが理想である。\n(3)パピークラスは主に6カ月齢までの子犬を対象とすることが多い。犬は1歳近くになるとパピーの頃と違う行動や問題行動が出やすくなる。\n(4) ドッグトレーナーには犬をトレーニングする能力だけでなく、飼い主にわかりやすく伝えるコミュニケーション能力や対話能力も求められる。\n(5)現在、補助犬を育成する訓練士の資格は、獣医師などの国家資格ではなく、厚生労働大臣から認定を受けた各育成団体が独自に認定するものである。", "supplement": "超要約：(2)正答。単発で終わるパピーパーティーでは、恐怖心や警戒心を覚えてしまったら、それを克服する機会が与えられないことがあるので、パピークラスにも参加して継続的に社会化することが理想である。 (5)現在、補助犬を育成する訓練士の資格は、獣医師などの国家資格ではなく、厚生労働大臣から認定を受けた各育成団体が独自に認定するものである。 覚え方：『ペット→教育』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 126, "problem": "学校での飼育動物に関する次の記述のうち、間違っているものを1つ選びなさい。", "choices": [{"no": 1, "text": "教育的目的を適切に果たすには、動物たちが適正に飼養管理され、健康であることが大切である。"}, {"no": 2, "text": "学校側の飼育の負担を軽減するためには、獣医師会や自治体などとのネットワークを活用することが大切である。"}, {"no": 3, "text": "子どもたちの野生動物保護についての関心を促すために野生種や希少種を選ぶべきである。"}, {"no": 4, "text": "学校で動物を飼育する場合には保護者に対しても人と動物の共通感染症の正しい情報を提供し、予防や管理に関する取り組みを知らせておくべきである。"}, {"no": 5, "text": "日常的な飼育管理は子どもに任せるのではなく、必ず大人が立ち会うべきである。\n【正答】"}, {"no": 3, "text": "(2級教本第9編第6章）参照。"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "野生動物は、行動管理や感染症などからくるリスクがあるため、学校での飼育、幼児のいる家庭での飼育や動物介在プログラムヘの参加などに活用するべきではない。", "supplement": "超要約：野生動物は、行動管理や感染症などからくるリスクがあるため、学校での飼育、幼児のいる家庭での飼育や動物介在プログラムヘの参加などに活用するべきではない。 覚え方：『持ち込まない・広げない』。経路と対策（隔離/消毒/報告）をセットで。"}, {"q": 127, "problem": "ペット飼育のマナーに関する次の記述のうち、最も妥当なものを1つ選びなさい。", "choices": [{"no": 1, "text": "（平成29)年の「東京都における犬及び猫の飼育実態調査」によれば、犬に関して迷惑だと感じることで上位を占める3項目は、「尿」「放し飼い」「悪臭」である。"}, {"no": 2, "text": "ペットの飼育マナーや常識は、時代や地域によって変化するものであることから、マナーの意味するところをそのときどきで理解し、柔軟に対応していく必要がある。"}, {"no": 3, "text": "鳴き声などで訴訟になった場合に飼い主に責任があるかどうかは、法務省において数値化された「受忍限度」の基準に照らして判断されるが、住宅が密集する都心部では、「お互いさま」と我慢するケースが少なくなり、受忍限度は低くなる傾向がみられる。"}, {"no": 4, "text": "ペット飼育による迷惑問題の「鳴き声」は、「ニオイ」と比較した場合、慣れると気にならなくなる傾向がある。"}, {"no": 5, "text": "ペットにまつわる事故やトラブルをなくすためには、「真正面からペットをじっと見つめる、ペットの頭の上からさわる」などといったペットの習性に応じた適切な扱い方を、ペットを飼っていない人たちにも知ってもらうことが効果的である。\n【正答】"}, {"no": 2, "text": "(2級教本第9編第7章）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "(1)「糞」「尿」「鳴き声」である。\n(2)正答。\n(3)数値化された基準はなく、侵害行為の態様や程度、被侵害利益の性質と内容、環境、被害防止措置の有無と内容などを総合的に勘案して判断される。なお、住宅が密集する都心部では、「お互いさま」と我慢するケースが多くなり、受忍限度は高くなる傾向がみられる。\n(4)ニオイは慣れると気にならなくなる傾向があるので、第三者に客観的に評価してもらうとよいと考えられている。\n(5)「真正面からペットをじっと見つめる、ペットの頭の上からさわる」のは、不適切な対応である。なお、ペットを飼っていない人たちにもペットの適切な扱い方を知ってもらうことは大切なことである。", "supplement": "超要約：(2)正答。 覚え方：『ペット→飼育』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 128, "problem": "飼養管理と公衆衛生に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "犬や猫の鳴き声や近隣家屋への侵入は、人への生活妨害とまではいえない。"}, {"no": 2, "text": "飼養動物の排泄物や汚物などは、人の生活環境の汚染とまではいえない。"}, {"no": 3, "text": "動物の抜け毛や衛生害虫などによる生活環境の悪化は、犬や猫などの飼養が嫌われる主な理由の一つである。"}, {"no": 4, "text": "犬や猫の放し飼いや逸走（いっそう）による放浪は、人への咬傷などへの恐怖感を与えるとまではいえなし‘°"}, {"no": 5, "text": "犬や猫は「家庭動物」なので、公衆衛生・社会生活上の問題になることはない。\n【正答】"}, {"no": 3, "text": "(2級教本第9編第8章第2節）参照。"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "(1)犬や猫の鳴き声や近隣家屋への侵入は、生活妨害で問題となる。\n(2)飼養動物の排泄物や汚物などは、不潔感および衛生上の問題となる。\n(3) 正答。\n(4)犬や猫の放し飼いや逸走による放浪は、咬傷などへの恐怖感を与え、問題となる。\n(5)生活妨害、不潔感および衛生上の問題、咬傷への恐怖感などが問題となる。", "supplement": "超要約：(3) 正答。 覚え方：『飼養管理→公衆衛生』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 129, "problem": "ペットのケガや事故への対応に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 5, "text": "(2級教本第9編第8章第3節）参照。"}], "answer_no": 5, "answer_raw": "(5)", "explanation": "(1)子犬は好奇心旺盛であり、なんでも口にしてしまう可能性があるため、特に注意する必要がある。\n(2)骨折は子犬で注意すべき事故のひとつであり、成長段階の子犬は、小さな衝撃であっても骨折することがある。\n(3)外傷は、散歩中や公園、庭など戸外で多く発生している。\n(4)異常がみられた場合には、できるだけ早く動物病院で受診する。\n(5)正答。リードをつけていない状態での事故が発生しているため、犬を道路等屋外で運動させる場合には、飼い主がコントロールできる状態を保つ必要がある。", "supplement": "超要約：(1)子犬は好奇心旺盛であり、なんでも口にしてしまう可能性があるため、特に注意する必要がある。 (5)正答。リードをつけていない状態での事故が発生しているため、犬を道路等屋外で運動させる場合には、飼い主がコントロールできる状態を保つ必要がある。 覚え方：『ペット→事故』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 130, "problem": "ペット飼育の歴史に関する次の記述のうち、最も妥当なものを1つ選びなさい。", "choices": [{"no": 1, "text": "江戸時代は身分制度があったため、一般庶民が動物を飼育することは難しく、大名や裕福な上級武士たちの間で小烏や金魚を飼うことがプームになっていた。"}, {"no": 2, "text": "現在のペットショップのルーツは、江戸時代に登場した小鳥商、見世物用の大型哺乳類を扱う唐物商、金魚売りや虫売りの行商など、生きものを扱う商人「鳥獣商」である。"}, {"no": 3, "text": "犬や猫などのブリーダーやペットオークションなど、現在のペット流通システムを担っている「畜犬商」は明治時代に登場した。"}, {"no": 4, "text": "江戸時代には動物の飼育書や解説書は作られていなかったので、動物の飼育方法は見よう見まねで行われていた。"}, {"no": 5, "text": "年代後半からのバプル景気の頃には平成のペットブームが巻き起こり、ハムスターやチンチラなどの小動物が一大プームとなった。\n【正答】"}, {"no": 2, "text": "(2級教本第10編第1章）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "(1)戦国の世が終わった江戸時代は、一般庶民が豊かではないが安心して暮らしていける家を得たことでさまざまな庶民娯楽が誕生し、小鳥や金魚、ネズミなどの飼育が庶民の間でブームになった。\n(2)正答。\n(3)犬や猫を販売した飼い主に交配相手を斡旋して繁殖させ、生まれた子犬・子猫を買い取ってさらに販売する「畜犬商」は第2次世界大戦後に登場し、この頃から生体販売ビジネスが本格化した。\n(4)江戸時代には鳥や犬、ネズミ、金魚などさまざまな動物の飼育書がすでに作られていた。また鳥屋などの動物商も、販売・売買の仲介をするだけでなく、飼育のアドバイザーとしての役割も担っていた。\n(5)1980年代後半の平成のペットプームでは、アロワナやディスカスなどの熱帯魚が一大プームとなった。", "supplement": "超要約：(2)正答。 覚え方：『ペット→飼育』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 131, "problem": "ペット飼育の変化に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "猫の飼育頭数が犬を上回った理由には、犬より鳴き声が小さい、集合住宅でも迷惑になりにくい、日中ほとんど寝ているので留守番させやすい、散歩の手間がかからないなどがある。"}, {"no": 2, "text": "犬と猫の飼育頭数の合計は、2003（平成15)年以降は15歳未満の子どもの人口を下回っている。"}, {"no": 3, "text": "「2010年動物愛護に関する世論調査」では、「ペット飼育がよい理由」として「防犯や留守番に役立つ」を回答した人が最上位になっている。"}, {"no": 4, "text": "現在、犬猫の飼育場所として犬は室内が多いが、猫は依然として屋外飼育が多い。"}, {"no": 5, "text": "人がペットの健康管理に気をつけるようになり、獣医療も進歩したことから、ペットの平均寿命は飛躍的に延び、現在では、犬が約8歳、猫が約5歳となっている。\n【正答】"}, {"no": 1, "text": "(2級教本第10編第2章第1~2節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "(1)正答。\n(2)（平成15)年以降は15歳未満の子どもの人口を上回っている。\n(3)以前は、「防犯や留守番に役立つ」が上位の理由であったが、現在は「生活に潤いや安らぎが生まれる」「家庭が和やかになる」「子どもたちが心豊かに育つ」などといった理由が上位を占めるようになっている。\n(4)猫も室内飼育が多い。\n(5)1990（平成2)~1991（平成3)年の調査によれば、犬が8.6歳、猫が5.1歳であったが、現在は犬や猫も約15歳前後と延びている。", "supplement": "超要約：(1)正答。 覚え方：『ペット→飼育』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 132, "problem": "ペット関連産業に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "日本のペット市場の内訳はペットフード市場の割合が最も高く70％で、続いて生体＋サービス市場、ペット用品市場となっている。"}, {"no": 2, "text": "総務省統計局の家計調査から飼い主の消費動向を見てみると、1世帯あたり年間総支出が少しずつ減少していることから、1世帯あたりのペットの関連支出も減少している。"}, {"no": 3, "text": "ペット飼育にはさまざまな費用がかかるが、ペットにかける年間の平均費用は、犬で約16万円、猫で約36万円との統計がある。"}, {"no": 4, "text": "ペット関連市場が安定的に成長しているのは、犬猫の飼育頭数が毎年1割ずつ増加していることによる。"}, {"no": 5, "text": "人もペットも高齢化の時代となったことから、数は少ないが、高齢ペットの訪問介護や一時預かり、老犬・老猫ホームなどの介護サービスも広がってきている。\n【正答】"}, {"no": 5, "text": "(2級教本第10編第3章第1~3節）参照。"}], "answer_no": 5, "answer_raw": "(5)", "explanation": "(1)割合が最も高く50％近くを占めるのは生体＋サービス市場で、ペットフード市場は36％となっている。\n(2)1世帯あたり年間総支出は微減しているが、ペット関連の支出は年々増加している。\n(3)犬が約36万円、猫が約16万円。犬はしつけやトレーニングの費用、トリミングなどの費用が猫よりもかかる分、高くなっている。\n(4)犬猫の飼育頭数は減少傾向だが、1頭あたりの経費が増えているのは、飼い主のライフスタイルを反映したありとあらゆるペット関連サービスの登場がペット業界の裾野を広げていることによる。\n(5)正答。", "supplement": "超要約：(5)正答。 覚え方：『ペット→関連産業』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 133, "problem": "ペット関連産業に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "ペットフードは高級化、多様化が進み、品質や機能性、安全性にこだわったプレミアムフード、スーパープレミアムフードが人気になっている。"}, {"no": 2, "text": "犬猫の販売ルートとしては、プリーダーから飼い主への直接販売が最も多い。"}, {"no": 3, "text": "「ペットフード安全法」の施行後に、ペットフード公正取引協議会では「ペットフードの表示に関する公正競争規約」を制定し、原材料の表示ルールなどを定めた。"}, {"no": 4, "text": "ペット用品の出荷総額は、犬用品・猫用品ともに毎年2割ずつ減少し続けている。"}, {"no": 5, "text": "総務省の家計消費状況調査によると、犬の飼い主、猫の飼い主ともにネット通販を利用している人はほとんどいないと報告されている。\n【正答】"}, {"no": 1, "text": "(2級教本第10編第4章第1~3節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "(1)正答。\n(2)プリーダーがペットオークションに出し、それをペットショップが購入して飼い主に販売するという販売ルートが最も多い。\n(3)ペットフード公正取引協議会の「ペットフードの表示に関する公正競争規約」制定は1974（昭和49)年で、「ペットフード安全法」の制定より前である。\n(4) 毎年数％ずつ増えている。\n(5)犬や猫の飼い主の約4割がネット通販を利用しているというデータがある。", "supplement": "超要約：(1)正答。 覚え方：『ペット→関連産業』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 134, "problem": "ペット関連産業に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "犬のトリミングサービスが近年成長した背景には、超短毛犬種の人気が上昇していることが関与している。"}, {"no": 2, "text": "ペットの高齢化にともない、犬の介護ケアサービスのニーズが高くなっているが、日本では関連サービスは提供されていない。"}, {"no": 3, "text": "犬との外出を楽しむ人が増え、ドッグランは利用しやすいサービスとして各地に増えているが、犬を同伴できるショッピングモールは整備されていない。"}, {"no": 4, "text": "学会等が認めた「専門医」が所属する動物病院も存在する。"}, {"no": 5, "text": "ペットが亡くなった場合、小動物であれば、空地や山林に埋葬することができる。\n【正答】"}, {"no": 4, "text": "(2級教本第10編第4章第4~9節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "(1)トイ・プードルなどのトリミングを必要とする犬種の飼育数の増加や家族同然の存在として人と同様のサービスが求められるようになってきたことが大きく関与している。\n(2)老犬ケアに特化した動物病院、老犬のデイサービス、リハビリ、訪問介護ケア、老犬ホームなどが登場している。\n(3)リードの使用やペット専用カートで入店できる商業施設が増えている。\n(4)正答。分野によっては専門医認定制度が定められているほか、動物種を限った専門病院や高度医療を行う病院も登場している。\n(5)自己の所有地への埋葬に規制はないが、公共の場所や他人の所有地に動物の死体を遺棄することは法律で規制されている。", "supplement": "超要約：(4)正答。分野によっては専門医認定制度が定められているほか、動物種を限った専門病院や高度医療を行う病院も登場している。 覚え方：『ペット→関連産業』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 135, "problem": "「商法」「消費者基本法」「消費者契約法」「個人情報の保護に関する法律」に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "「契約不適合責任」などのように、民法と商法の両方に規定がある場合は、特別法である民法が一般法である商法に優先して適用される。"}, {"no": 2, "text": "購入したペットに病気や障害があることが後で分かった場合、購入者である一般の飼い主は、その事実を知ったときから1年以内であれば、履行の追完請求や損害賠償請求などができる場合がある。"}, {"no": 3, "text": "「消費者基本法」は、近年の消費者からのクレーム・トラブルの増加を受けて、消費者の権利を限定するとともに、事業者の保護を強化することを主眼とした法律となっている。"}, {"no": 4, "text": "「消費者契約法」では、「消費者はどんな理由でもキャンセルができないとする条項」は、無効にできる不当な契約条項にはならないとされている。"}, {"no": 5, "text": "「個人情報の保護に関する法律」では、氏名・生年月日・住所の3つがセットになった情報は、個人を識別できるものではあるが、一般的な情報であることから個人情報には該当しないとされている。\n【正答】"}, {"no": 2, "text": "(2級教本第10編第5章第1節）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "(1)契約不適合責任とは、売買された物（ペットなど）が、契約の内容に適合しない場合（病気や障害など）に、売主が買主に対して負う責任のことである。商法と民法に契約不適合責任についての規定があるが、商法は民法に対して特別法であるので、商人間の売買については商法の規定が適用される（請求期間など）。\n(2)正答。「民法」では1年以内、商法では商人間の売買に限っては6カ月以内であれば責任追及ができるとされていることから、プリーダーとペットショップとの売買の場合は6カ月以内、一般の飼い主とペットショップとの売買などの場合は1年以内であれば責任を追及できる。\n(3) 「消費者基本法」は、消費者の権利の尊重と消費者の自立支援を主眼とした法律である。\n(4) 「消費者はどんな理由でもキャンセルができないとする条項」や「事業者は責任を負わないとする条項」などは、無効にできる不当な契約条項の一つとなっている。\n(5) 個人情報に該当する。また、「個人情報保護法」では、個人情報を本人以外の第三者に渡すときは、あらかじめ本人の同意を得ることが原則とされている。", "supplement": "超要約：(2)正答。「民法」では1年以内、商法では商人間の売買に限っては6カ月以内であれば責任追及ができるとされていることから、プリーダーとペットショップとの売買の場合は6カ月以内、一般の飼い主とペットショップとの売買などの場合は1年以内であれば責任を追及できる。 覚え方：『商法→消費者基本法』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 136, "problem": "「動物の愛護及び管理に関する法律」の「動物取扱業」に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "第一種動物取扱業と第二種動物取扱業の規制の対象となる動物種には、両生類と魚類に属する動物も含まれる。"}, {"no": 2, "text": "試験研究用の実験動物を飼養・保管している場合は、第二種動物取扱業の規制の対象にはならないが、第一種動物取扱業の規制の対象となる。"}, {"no": 3, "text": "第一種動物取扱業の規制の中には、施設の構造・規模・管理に関する基準に適合していないときは、登録の拒否ができる仕組みはあるが、取消しができる仕組みは設けられていない。"}, {"no": 4, "text": "環境大臣に対して行うこととされる第一種動物取扱業者の登録の有効期限は3年間であり、自動更新がされる仕組みとなっている。"}, {"no": 5, "text": "第一種動物取扱業者は、販売・貸出し時における事前説明、犬猫の繁殖・販売にかかる場合の犬猫等健康安全計画の策定、販売・貸出し・展示における犬猫の夜間の展示制限、登録番号などを記載した標識の掲示などの各種規制を守らなければならない義務が課せられている。\n【正答】"}, {"no": 5, "text": "(2級教本第10編第6章第1~2節）参照。"}], "answer_no": 5, "answer_raw": "(5)", "explanation": "(1)第一種動物取扱業と第二種動物取扱業の両方とも、規制の対象となる動物種は、哺乳類・烏類・爬虫類に限定されている。\n(2)実験動物と産業動物については、第一種・第二種動物取扱業の規制の対象から除外されている。\n(3)登録の拒否だけでなく、取消しができる仕組みもある。\n(4)第一種動物取扱業者の登録の有効期間は5年間であり、自動更新の仕組みはない。\n(5)正答。", "supplement": "【ストーリー】動物愛護管理法は“飼い主の教科書”。虐待を止めて、ちゃんと飼って、人と動物が仲良く暮らすための基本ルール。家庭動物の話はまずこの法律に戻る。"}, {"q": 137, "problem": "「動物の愛護及び管理に関する法律」の「動物取扱業」に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 3, "text": "(2級教本第10編第6章第1~2節）参照。"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "(1)事業所ごとに1名以上を置く義務がある。\n(2)動物取扱責任者の選任要件は、次の1~3のいずれかを満たすこととされている。\n1.獣医師の免許を取得していること\n2.愛玩動物看護師の免許を取得していること\n3.次の（ア）、（イ）の両方または、（ア）、（ウ）の両方を満たしていること\n（ア）種別に係る半年以上の実務経験または、実務経験と同等の1年以上の飼養経験\n（イ）種別に係る知識及び技術について1年間以上教育する学校を卒業\n（ウ）公平性、専門性のある団体が行った試験により資格等を得ていることまた、事業所の動物取扱責任者以外のすべての職員に対し、動物取扱責任者研修において得た知識および技術に関する指導を行う能力を有することも要件となっている。\n(3)正答。\n(4)設けられた主な趣旨は、自治体の指導を責任をもって受ける窓口担当者を明確にするとともに、動物の飼養・保管に関する能力や知識の向上を図っていくための体制が必要であったことなどであるといわれている。\n(5)事前説明の実施者を動物取扱責任者に限定する仕組みはない。", "supplement": "【ストーリー】動物愛護管理法は“飼い主の教科書”。虐待を止めて、ちゃんと飼って、人と動物が仲良く暮らすための基本ルール。家庭動物の話はまずこの法律に戻る。"}, {"q": 138, "problem": "「動物の愛護及び管理に関する法律」において「動物販売業者の責務」として規定されている「購入者に対する販売動物の説明」に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "この措置が設けられた目的には、動物の遺棄につながるおそれのある安易な飼養などの防止に役立てることが含まれているが、動物の虐待や近隣とのトラプルの未然防止に役立てることは含まれていない。"}, {"no": 2, "text": "この措置を行う責任がある「動物販売業者」には、哺乳類・鳥類・爬虫類を取り扱う業者だけでなく、魚類・両生類を取り扱う業者も含まれる。"}, {"no": 3, "text": "説明事項には、販売する動物の習性や特性に関することは含まれない。"}, {"no": 4, "text": "この措置を行う責任があるのは、第一種・第二種動物取扱業の規制を受ける者に限定されている。"}, {"no": 5, "text": "この措置が設けられた目的には、動物の魅力を理解した飼養者を増やすことにより、動物の販売業の振興を図ることが含まれている。\n【正答】"}, {"no": 2, "text": "(2級教本第10編第6章第2節）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "(1)動物の遺棄や虐待、近隣住民との間でのトラプルにつながるおそれのある安易な飼養の防止に役立てるために設けられた措置である。\n(2)正答。\n(3)習性や特性に関することも含まれている。\n(4)「動物取扱業者（第一種・第二種）」以外の者も含まれる。\n(5)「動物販売業者（動物取扱業者以外も含む）」が、動物取り扱いの専門家として、販売する動物についての適正な飼養方法を購入者にアドバイスすることが、購入者および社会に対する責務であることから設けられた規定である。", "supplement": "【ストーリー】動物愛護管理法は“飼い主の教科書”。虐待を止めて、ちゃんと飼って、人と動物が仲良く暮らすための基本ルール。家庭動物の話はまずこの法律に戻る。"}, {"q": 139, "problem": "「動物の愛護及び管理に関する法律」の「動物取扱業」に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "「老犬老猫ホーム（有償で動物を譲り受けて飼養する施設）」は、第一種動物取扱業の規制の対象になる。"}, {"no": 2, "text": "ペットホテルは、第一種動物取扱業の規制の対象にならない。"}, {"no": 3, "text": "犬のしつけのための出張訓練は、有償・無償の別にかかわらず、第一種動物取扱業の規制の対象にならない。"}, {"no": 4, "text": "動物を持たずにインターネットなどで売買の仲介を行う行為は、第一種動物取扱業の規制の対象にならない。"}, {"no": 5, "text": "猫を撮影モデル用に派遣する行為は、第一種動物取扱業の規制の対象業種の「展示」に該当する。\n【正答】"}, {"no": 1, "text": "(2級教本第10編第6章第2節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "(1)正答。\n(2)該当する。\n(3)有償・無償の別にかかわらず、営利性がある場合は第一種動物取扱業の「訓練」に該当する。\n(4)対象になる。\n(5)「貸出し」に該当する。", "supplement": "【ストーリー】動物愛護管理法は“飼い主の教科書”。虐待を止めて、ちゃんと飼って、人と動物が仲良く暮らすための基本ルール。家庭動物の話はまずこの法律に戻る。"}, {"q": 140, "problem": "動物取扱業に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "犬や猫の夜間展示の禁止の対象は、犬猫等販売業者だけでなく、貸出業者、展示業者で犬猫を扱っている業者も含まれる。"}, {"no": 2, "text": "等健康安全計画は、幼齢な犬猫の飼養方法や展示方法などを記載するものであり、販売が困難となった犬猫の取り扱いは犬猫等健康安全計画に記載する必要はないとされている。"}, {"no": 3, "text": "犬や猫を飼養管理するケージの大きさの基準を満たす必要があるのは第一種動物取扱業のみであり、第二種動物取扱業は除外されている。"}, {"no": 4, "text": "群管理では食事の給与や清掃などは弱っている動物がいるハイリスクグループから始め、最後が清浄グループになるようにする。"}, {"no": 5, "text": "動物取扱業は経験のみが重要であるので、「標準作業手順書」のようなものを作る必要はない。\n【正答】"}, {"no": 1, "text": "(2級教本第10編第6章第4節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "(1)正答。\n(2)販売が困難となった犬猫の取り扱いを犬猫等健康安全計画に記載する必要がある。\n(3)第二種動物取扱業も定められた基準を満たす必要がある。\n(4)群管理では食事の給与や清掃などは清浄グループから始め、最後がハイリスクグループになるようにし、感染の蔓延を予防する。\n(5)すべてのスタッフが同じ飼養管理を行えるよう「標準作業手順書」を作成し、日々の管理を徹底する必要がある。", "supplement": "超要約：(1)正答。 覚え方：『動物取扱業→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 141, "problem": "ペット関連産業従事者に関する次の記述のうち、最も妥当なものを1つ選びなさい。", "choices": [{"no": 1, "text": "動物取扱業者は、業務を通じて顧客に対する適正飼養及び動物愛護の普及啓発を行うという役割も担っている。"}, {"no": 2, "text": "犬猫等販売業者の役割は健全な動物を販売することであり、「動物愛護推進員」などが行う動物愛護の普及啓発活動とは一線を画すものである。"}, {"no": 3, "text": "ペット業界のさらなる発展のためには、ペット関連産業従事者が利益追求を優先する考え方をもつことが最も重要である。"}, {"no": 4, "text": "動物愛護管理法における「動物の所有者または占有者の責務」において、所有者・占有者とは「飼い主」のことであり、販売前のペットを一時的に所有している犬猫等販売業者はこれに該当しない。"}, {"no": 5, "text": "世論調査の結果によると、国などへの取り組みの要望として、「ペットを取り扱う業者に対する規制や指導を強く求める」と考えている人は近年ではほとんどいない。\n【正答】"}, {"no": 1, "text": "(2級教本第10編第7章）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "(1)正答。\n(2)動物取扱業者は、業務を通じて顧客に対する適正飼養及び動物愛護の普及啓発を行うという役割を担っているため、「動物愛護推進員」の活動との親和性が高いと考えられている。\n(3)人とペットの関わり方は変化を続け、医食住、学び・遊びなど暮らし方全般を包括する内容に変わってきており、ペット関連産業従事者も業界の発展だけにとらわれず、人とペットの幸せな暮らしを支える産業であるという認識をもつことが重要である。\n(4) 「所有者」とは全面的に支配している権利者のことで、販売前は犬猫等販売業者のことを指す。また「占有者」は対象となる動物を、意思を持って事実上支配している状態の者を指し、トリマーやペットホテルが一時的に預かる場合も含まれる。\n(5)動物愛護に対する世論調査では、「ペットを取り扱う業者に対する規制や指導を強める」ことを求める声が年々増加しており、社会の動物愛護への気運の高まりと、動物取扱業への専門家としての期待をうかがい知ることができる。", "supplement": "超要約：(1)正答。 (2)動物取扱業者は、業務を通じて顧客に対する適正飼養及び動物愛護の普及啓発を行うという役割を担っているため、「動物愛護推進員」の活動との親和性が高いと考えられている。 覚え方：『ペット→関連産業従事者』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}]};

const DECK = window.DECK_DATA;
let idx = 0;
let picked = null;

const el = (id)=>document.getElementById(id);
const qnoEl = el('qno');
const problemEl = el('problem');
const listEl = el('choices');
const ansEl = el('ans');
const expEl = el('exp');
const supEl = el('sup');
const revealWrap = el('revealWrap');
const progEl = el('prog');
const deckEl = el('deckName');
const drawer = el('drawer');

const searchEl = el('search');
const fontEl = el('font');
const lhEl = el('lh');

function stripAnswerFromProblem(t){
  if(!t) return '';
  // Remove anything from '【正答】' onward if OCR accidentally included it in the question text
  const idx = t.indexOf('【正答】');
  if(idx >= 0) t = t.slice(0, idx);
  // Also remove lines that start with '正答' just in case (rare OCR patterns)
  t = t.replace(/^\s*正答\s*[:：].*$/gm, '');
  return t.trim();
}

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function applyTypo(){
  const size = parseInt(fontEl.value,10);
  const lh = parseFloat(lhEl.value);
  document.body.style.lineHeight = lh;
  problemEl.style.fontSize = (size+4) + 'px';
  listEl.querySelectorAll('.choice').forEach(c => c.style.fontSize = size + 'px');
  document.querySelectorAll('.block').forEach(b => b.style.fontSize = (size-1) + 'px');
}

function render(){
  const it = DECK.items[idx];
  picked = null;

  // ✅ 初期状態では解答エリアは確実に隠す＆中身も空
  revealWrap.hidden = true;
  ansEl.textContent = '';
  expEl.textContent = '';
  supEl.textContent = '';

  listEl.innerHTML = '';
  deckEl.textContent = DECK.title;
  progEl.textContent = `${idx+1}/${DECK.items.length}`;
  qnoEl.textContent = `Q${it.q}`;
  problemEl.textContent = stripAnswerFromProblem(it.problem || '');

  (it.choices||[]).forEach(ch=>{
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.innerHTML = `<span class="no">(${ch.no})</span><span class="txt">${escapeHtml(ch.text).replace(/\n/g,'<br>')}</span>`;
    btn.addEventListener('click', ()=> pickChoice(ch.no, btn));
    listEl.appendChild(btn);
  });

  applyTypo();
}

function pickChoice(no, btn){
  if(picked !== null) return;
  picked = no;

  const it = DECK.items[idx];
  const correct = it.answer_no;

  const buttons = Array.from(listEl.querySelectorAll('.choice'));
  buttons.forEach(b => b.disabled = true);

  if(correct != null){
    if(no === correct) btn.classList.add('correct');
    else btn.classList.add('wrong');

    buttons.forEach(b=>{
      const m = b.querySelector('.no')?.textContent?.match(/\((\d+)\)/);
      if(m && parseInt(m[1],10) === correct){
        b.classList.add('correct');
      }
    });
  }

  // ✅ 選択されたタイミングで初めて解答を入れて表示
  ansEl.textContent = it.answer_no ? `(${it.answer_no})` : (it.answer_raw||'');
  expEl.textContent = it.explanation || '';
  supEl.textContent = it.supplement || '';
  revealWrap.hidden = false;

  revealWrap.scrollIntoView({behavior:'smooth', block:'start'});
}

function next(){ idx = (idx+1) % DECK.items.length; render(); window.scrollTo({top:0, behavior:'smooth'});}
function prev(){ idx = (idx-1+DECK.items.length) % DECK.items.length; render(); window.scrollTo({top:0, behavior:'smooth'});}

el('next').addEventListener('click', next);
el('prev').addEventListener('click', prev);

el('settings').addEventListener('click', ()=>{
  drawer.hidden = !drawer.hidden;
});

searchEl.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    const v = searchEl.value.trim().replace(/^Q/i,'');
    const q = parseInt(v,10);
    if(Number.isFinite(q)){
      const pos = DECK.items.findIndex(x=>x.q===q);
      if(pos>=0){ idx=pos; render(); drawer.hidden = true; window.scrollTo({top:0, behavior:'smooth'}); }
    }
  }
});

fontEl.addEventListener('change', applyTypo);
lhEl.addEventListener('change', applyTypo);

document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') next();
  if(e.key==='ArrowLeft') prev();
});

render();

</script>
</body>
</html>
