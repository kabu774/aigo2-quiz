window.DECK_DATA = {"title": "愛玩動物飼養管理士2級", "items": [{"q": 1, "problem": "公益社団法人日本愛玩動物協会（以下、本協会という）に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "愛玩動物飼養管理士が動物の適正飼養に関する法律問題や医療問題の相談を受ける場合、弁護士法や獣医師法の違反に問われることはないので、その内容を気にする必要はない。"}, {"no": 2, "text": "会の会員種別は、正会員（個人、団体）、一般会員（個人、学生、団体）などがあり、一般会員は社員総会に出席して協会の意志決定や運営維持にあたる。"}, {"no": 3, "text": "「動物」とは、一般に野生動物を含む動物全般と解釈される。本協会においてもこの法律でいう動物のすべてを活動対象としている。"}, {"no": 4, "text": "愛玩動物飼養管理士は、環境教育等促進法に基づく人材認定等事業として登録を受けている。"}, {"no": 5, "text": "本協会は、動物に対する虐待行為の監視や摘発への協力、野良犬や野良猫の譲渡活動を行う。\n【正答】"}, {"no": 4, "text": "(2級教本第1編第1章第2節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "(1)法律や金銭に関することは弁護士、動物の病気に関することは獣医師の範囲であり、これらの問題に深く立ち入りすぎることは、弁護士法や獣医師法に違反することになりかねない。\n(2)社員総会に出席し協会の運営維持などを行うことができるのは、正会員である。\n(3)法律でいう「動物」とは、一般に野生動物を含む動物全般と解釈されるが、本協会では「家庭動物等の飼養及び保管に関する基準」に定義されている「家庭等で飼養及び保管されている動物で、哺乳類、鳥類及び爬虫類に属する動物」を主な活動対象としている。\n(4)正答。\n(5)定款に定められている本協会の活動は、人を対象にした動物の愛護および適正な飼養管理に関する知識等の普及啓発である。", "supplement": "【語呂/ストーリー】『公益＝みんなのため』『社団＝人が集まる』。そこに“お墨付き（認定）”が付くのが公益社団法人。だから“国の機関”じゃなくて『民間チーム＋公益認定』。 【ストーリー】環境教育等促進法は『環境の勉強を広めよう』の後押し係。人材登録みたいな制度が出たら、この法律の出番。"}, {"q": 2, "problem": "日本愛玩動物協会は「公益社団法人」としての認定を受けていますが、次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "公益社団法人とは、ボランティア活動をはじめとする市民が行う自由な社会貢献活動の健全な発展を促進する団体で、特定非営利活動法人(NPO)と呼ばれることもある。"}, {"no": 2, "text": "公益社団法人は、その目的である不特定かつ多数の者の利益に資する活動を積極的に実施できるように、その設立にあたっては行政庁（内閣府または都道府県）に認定を受ける手続きが免除されている。"}, {"no": 3, "text": "公益社団法人とは、広く国民の利益になるような事業を行うものであるが、その活動から得た利益の一部については、会員間で出資金に応じて分配できるとされている。"}, {"no": 4, "text": "社団法人とは、政府の機関の一種であり、その職員は公務員に準ずるとされている。"}, {"no": 5, "text": "公益社団法人とは、登記のみで設立できる一般社団法人とは異なり、不特定かつ多数の者の利益の増進に寄与する公益事業を行う団体であると行政庁（内閣府または都道府県）から認定された公益性の高い団体である。\n【正答】"}, {"no": 5, "text": "(2級教本第1編第1章第2節）参照。"}], "answer_no": 5, "answer_raw": "(5)", "explanation": "(1)公益社団法人とは、一般社団・財団法人法に基づいて設立された一般社団法人のうち、公益法人認定法に基づいて公益性を認定された社団法人のことをいい、特定非営利活動促進法に基づいて特定非営利活動を行う特定非営利活動法人(NPO)とは区別される。\n(2)庁（内閣府または都道府県）から認定を受ける手続きを免除されることはない。\n(3)不特定多数の利益を追求せねばならず、会員で分配することはできない。\n(4)公的機関ではなく民間の団体であるが、公益法人は、民間非営利部門の一翼としてさまざまな民間公益活動を担っており、社会を支える重要な役割を果たしている。\n(5)正答。", "supplement": "【語呂/ストーリー】『公益＝みんなのため』『社団＝人が集まる』。そこに“お墨付き（認定）”が付くのが公益社団法人。だから“国の機関”じゃなくて『民間チーム＋公益認定』。 【ストーリー】内閣府は“制度の受付カウンター”。公益法人の認定など『仕組みの窓口』を担当するイメージ。動物愛護の現場担当（環境省）とは役割が違う。"}, {"q": 3, "problem": "日本愛玩動物協会は「公益社団法人」としての認定を受けていますが、次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "本協会の監督官庁は農林水産省であり、動物愛護管理行政を担当している国の機関は環境省である。"}, {"no": 2, "text": "会の監督官庁は環境省であり、動物愛護管理行政を担当している国の機関は農林水産省である。"}, {"no": 3, "text": "本協会の監督官庁は内閣府であり、動物愛護管理行政を担当している国の機関は環境省である。"}, {"no": 4, "text": "本協会の監督官庁は内閣府であり、動物愛護管理行政を担当している国の機関も内閣府である。"}, {"no": 5, "text": "本協会の監督官庁は法務省であり、動物愛護管理行政を担当している国の機関は環境省である。\n【正答】"}, {"no": 1, "text": "(2級教本第1編第1章第2節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "(1)正答。本協会の監督官庁は内閣府であり、動物愛護管理行政を担当している国の機関は環境省である。", "supplement": "【語呂/ストーリー】『公益＝みんなのため』『社団＝人が集まる』。そこに“お墨付き（認定）”が付くのが公益社団法人。だから“国の機関”じゃなくて『民間チーム＋公益認定』。 【ストーリー】内閣府は“制度の受付カウンター”。公益法人の認定など『仕組みの窓口』を担当するイメージ。動物愛護の現場担当（環境省）とは役割が違う。 【語呂/ストーリー】『環境』は自然や生き物のルール担当。動物愛護管理もここ。迷ったら『動物愛護＝環境省』で固定。"}, {"q": 4, "problem": "次の文章の空欄［A］に入る言葉として、正しいものを1つ選びなさい。\n公益社団法人日本愛玩動物協会（以下、本協会という）では、愛玩動物飼養管理士について、［A］の趣旨に基づき、愛玩動物の愛護および適正飼養管理の普及啓発活動などを行うために必要な知識・技能を、本協会の通信教育によって体系的に修め、所定の試験に合格し、協会より認定登録された者』と位置づけています。", "choices": [{"no": 1, "text": "狂犬病予防法"}, {"no": 2, "text": "身体障害者補助犬法"}, {"no": 3, "text": "愛がん動物用飼料の安全性の確保に関する法律"}, {"no": 4, "text": "動物の愛護及び管理に関する法律"}, {"no": 5, "text": "鳥獣の保護及び管理並びに狩猟の適正化に関する法律\n【正答】"}, {"no": 4, "text": "(2級教本第1編第2章第1節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "(1)〜（3）、（5）は、一般国民が動物を飼養する場合に関わりの深い法令であり、いずれも2級愛玩動物飼養管理士の教本第1巻で解説されている。", "supplement": "【語呂/ストーリー】『公益＝みんなのため』『社団＝人が集まる』。そこに“お墨付き（認定）”が付くのが公益社団法人。だから“国の機関”じゃなくて『民間チーム＋公益認定』。 【ストーリー】動物愛護管理法は“飼い主の教科書”。虐待を止めて、ちゃんと飼って、人と動物が仲良く暮らすための基本ルール。家庭動物の話はまずこの法律に戻る。 【語呂/ストーリー】『狂犬病＝犬（けん）』で名前のまんま。犬の登録と注射がセット。犬が出たらこの法律が第一候補。"}, {"q": 5, "problem": "次の文章の空欄［A］に入る言葉として正しいものを1つ選びなさい。\n多くの人がボランティア活動に興味を持ち、違和感なく受け入れるようになったのは、［A］の阪神・淡路大震災以降で、この年を「ボランティア元年」という。", "choices": [{"no": 1, "text": "1923年"}, {"no": 2, "text": "1995年"}, {"no": 3, "text": "2004年"}, {"no": 4, "text": "2011年"}, {"no": 5, "text": "2016年\n【正答】"}, {"no": 2, "text": "(2級教本第1編第4章）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "(1)全国から多くの人が救援と復旧のために被災地に駆けつけ、活動に参加したことで、ボランティアの意味や価値を日本中の人々が知ることになった。", "supplement": "【語呂/ストーリー】阪神・淡路大震災は1995年。『行く！救援（1=いく、995=きゅうきゅうご）』みたいに雑に語呂で固定してOK。ボランティア元年＝1995。"}, {"q": 6, "problem": "生命倫理や動物福祉の考え方に関する次の記述のうち、正しいものを1つ選び、なさい。", "choices": [{"no": 4, "text": "(2級教本第2編第1章第1~2節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "（正答：(4) デカルト）この設問は『動物をどう見るか』の思想史のひっかけ。17世紀ヨーロッパは機械仕掛けの時計が流行し、“世界は機械みたいに動く”という考えが強かった。\nデカルト（フランス）はその流れで、動物は心や言語を持たない“自動機械”に近い、と考える「動物機械論」を主張した。だから(4)が正しい。\n(1)カントは「仮言命法（〜なら〜せよ）」ではなく、条件なしに守る「定言命法」を重視。なので誤り。\n(2)「法」と「道徳」を総合して「人倫」と呼ぶのはヘーゲルで、ベンサムではない。\n(3)アリストテレスは動物に理性はないとし、人間が利用するために存在すると位置づけた（“共存のため”は誤り）。\n(5)「道徳法則」はカントの軸なのでミルの説明としては不適。", "supplement": "【補足ストーリー】時計みたいな機械が大ブームだった時代に、デカルトは『動物はボタンを押せば動くロボみたいなもの』と考えた――これが動物機械論。だから“デカルト＝機械”を合言葉にして、選択肢で『動物は機械』が出たら(4)を即ロックすると早い。"}, {"q": 7, "problem": "生命倫理や動物福祉に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "西洋人とは異なり、日本人は古来から一貫して、人間と動物を明確に区別し、自然と隔絶した生活をしてきた。"}, {"no": 2, "text": "天武天皇は、675年に、牛、馬、犬、サル、ニワトリ以外の肉を食べることを禁じた「天武の勅令」を出した。"}, {"no": 3, "text": "古代ギリシャ文明とユダヤ-キリスト教は、いずれも人間と人間以外の生き物を対等な存在として考えていた。"}, {"no": 4, "text": "「進化論」を提唱したイギリスの自然科学者チャールズ・ダーウィンは、動物は思考能力を持っておらず、人間とはまったく違うと考え、動物と人間の分断を主張した。"}, {"no": 5, "text": "ドイツの哲学者アルトゥル・ショーペンハウアーは、理性の有無ではなく、すべての痛みを感じる生き物に対して同情することが道徳的な態度であるとした。\n【正答】"}, {"no": 5, "text": "(2級教本第2編第1章第3節）参照。"}], "answer_no": 5, "answer_raw": "(5)", "explanation": "(1)西洋人とは異なり、日本人は古来から一貫して、自然に従い、自然と調和しようとしてきた。\n(2)天武天皇は675年に、牛、馬、犬、サル、ニワトリの肉を食べることを禁じた。\n(3)古代ギリシャ文明とユダヤ-キリスト教は、いずれも人間以外の生き物に対して寛容ではなく、対等な存在ではないと考えていた。\n(4)チャールズ・ダーウィンは、動物と人間の連続性を主張した。\n(5)正答。アルトウル・ショーペンハウアーは、すべての痛みを感じる生き物に対して同情することが道徳的な態度であるとした。", "supplement": "【語呂/ストーリー】ダーウィンは『人も動物も“つながってる（連続）”』派。もし選択肢に“分断”が出たら、それはダーウィンじゃない、と即切り。 【語呂/ストーリー】ショーペンハウアーは“しょんぼり同情マン”。理屈より『痛いのはかわいそう』が道徳の出発点。『同情＝ショーペン』で引っかけ回避。"}, {"q": 8, "problem": "イギリスとアメリカにおける近代的動物愛護運動の始まりに関する次の記述のうち、最も妥当なものを1つ選びなさい。", "choices": [{"no": 1, "text": "ニューヨークにアメリカ動物虐待防止協会(ASPCA)を設立し、アメリカに動物虐待防止法を成立させる契機を作ったのは、リチャード・マーチンである。"}, {"no": 2, "text": "イギリスで1800年代に成立した法律である「家畜の虐待と不当取り扱い防止条例」の提案者は、ヘンリー・バーグである。"}, {"no": 3, "text": "イギリスの「家畜の虐待と不当取り扱い防止条例」の成立に当たっては、動物虐待防止協会(SPCA・現在の王立虐待防止協会RSPCA)の活動が大きく貢献したといわれている。"}, {"no": 4, "text": "イギリスやアメリカにおいて始まった動物愛護運動の主な対象動物は、家畜ではなく実験動物であった。"}, {"no": 5, "text": "イギリスの知識人たちが動物虐待防止運動を始めた理由は、「イギリス国民が動物に対して憐れみの気持ちを持つように教育することによって、イギリスを文明国の名にふさわしい国にしようとしたため」であったといわれている。\n【正答】"}, {"no": 5, "text": "(2級教本第2編第2章第3~4節）参照。"}], "answer_no": 5, "answer_raw": "(5)", "explanation": "(1)ヘンリー・バーグである。\n(2)リチャード・マーチンである。このため、この法律は通称「マーチン法」と呼ばれている。\n(3)1822年に成立した「家畜の虐待と不当取り扱い防止条例」の法案を国会に提出したのはリチャード・マーチン議員で、ロンドンで動物虐待防止協会が設立されたのは、マーチン法が成立した2年後の1824年である。\n(4)馬車を引いている馬などの家畜であった。\n(5)正答。", "supplement": "【語呂/ストーリー】アメリカ（USA）の“バーグさん”が、犬や馬がいじめられるのを見て『それはダメだ！』とNYで仲間を集めてASPCAを作った…って映画の主役だと思って覚える。『バーグ＝米国＝ASPCA（NY）』で1セット。 【語呂/ストーリー】A＝AmericaのA。だからASPCAは“アメリカのSPCA”。場所はNY。英国のRSPCAとごっちゃになりやすいけど、『Aはアメリカ』で固定すると迷子にならない。 【語呂/ストーリー】英国のSPCAに“R（Royal=王室）”が付いてRSPCA。『Rはロイヤル＝イギリス』って覚えると、米国のASPCAとすぐ区別できる。"}, {"q": 9, "problem": "明治時代～第二次世界大戦までの日本の動物愛護運動に関する次の記述のうち、最も妥当なものを1つ選びなさい。", "choices": [{"no": 1, "text": "日本の近代動物愛護運動のはじまりは、東京で明治時代に設立された「動物虐待防止会（後の動物愛護会）」の活動であり、その設立者は平岩米吉である。"}, {"no": 2, "text": "日本人道会は、広井辰太郎が中心となって設立された団体であり、当初は野良犬や野良猫の保護に力を入れた活動を行っていた。"}, {"no": 3, "text": "日本人道会の活動は、動物愛護会（前身は動物虐待防止会）に引き継がれ、化製所の若い健康な犬に生きるチャンスを与えるため、日比谷公園で年2~3回「愛犬マーケット」を実施し、廉価で希望者に引き取ってもらう活動を行った。"}, {"no": 4, "text": "新渡戸稲造は、昭和時代に『動物文学］を創刊し、その後に動物文学会を創立した。"}, {"no": 5, "text": "広井辰太郎は、機関誌『あはれみ』で、動物を残酷に扱うことが世の中に良くない影響を与えると唱えた。\n【正答】"}, {"no": 5, "text": "(2級教本第2編第2章第5節）参照。"}], "answer_no": 5, "answer_raw": "(5)", "explanation": "（正答：(5) 広井辰太郎と『あはれみ』）この問題は“いつ・誰が・どんな形で動物愛護を広めたか”の時代整理がポイント。明治〜大正は都市化が進み、犬や馬など身近な動物の扱いが社会問題として見えやすくなった。\n(5)広井辰太郎は機関誌『あはれみ』で、動物を残酷に扱うことが社会に悪い影響を与えると訴えたので正しい。\n(1)動物虐待防止会（後の動物愛護会）の設立者は平岩米吉ではなく、広井辰太郎（牧師でもあった）。\n(2)日本人道会は“大正”の設立で、新渡戸万里・バーネット大佐夫人が中心。当初は牛馬の保護が軸で、野良犬猫が主軸ではない。\n(3)順番が逆：動物虐待防止会（明治）が先、日本人道会（大正）が後。\n(4)新渡戸稲造は動物文芸で思想を広めた側（『動物愛は人類愛の延長』など）。昭和に創刊…は誤りで、平岩米吉とも混同注意。", "supplement": "【補足ストーリー】明治は“近代化で町が大きくなる→動物の扱いが『家庭の話』から『社会の問題』になる”時代。そこで広井辰太郎は『あはれみ』という雑誌で『残酷は人の心も社会も荒らす』と訴えた。覚え方は『広井＝あはれみ＝残酷はダメ（社会に悪影響）』の3点セットで固定すると、日本人道会（大正）と混ざらない。"}, {"q": 10, "problem": "第二次世界大戦後の日本の動物愛護の活動に関する次の記述のうち、最も妥当なものを1つ選びなさい。", "choices": [{"no": 1, "text": "ジャック・ブリンクレーや平岩米吉らの尽力により設立された社団法人日本動物愛護協会（現在の公益財団法人日本動物愛護協会）の活動は、当初は、動物愛護思想の普及啓発・教育活動に重点を置いていたが、苦しんでいる動物を救うことを中心とするものに変化していった。"}, {"no": 2, "text": "「動物の保護及び管理に関する法律（現在の動物の愛護及び管理に関する法律）」の制定に向けた動きがあった当時、イギリスの大衆紙や欧米の動物愛護団体からは、日本で動物保護の法律が制定されていないことに対する強い批判が寄せられていた。"}, {"no": 3, "text": "明治から大正時代に設立された動物愛護会（前身は動物虐待防止会）や日本人道会の活動は、戦後に急速に拡大し、現在は政府機関の一部（現在の環境省）として活動を続けている。"}, {"no": 4, "text": "GHQ（連合国軍最高司令官総司令部）からの指令により、秋分の日がある9月を「動物愛護月間」としたのが、日本における「動物愛護週間」の始まりである。"}, {"no": 5, "text": "「新潟県中越大晨災」の際の救援活動がきっかけとなり、「緊急災害時動物救援本部（後のペッ卜災害対策推進協会）」が設立されるなどして、被災した飼い主やペットの救護活動が推進・普及されてきている。\n【正答】"}, {"no": 2, "text": "(2級教本第2編第2章第5節）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "(1)当初は、現在苦しんでいる動物を救うことに重点を置いていたが、動物愛護思想の普及啓発・教育活動を中心とするものに変化していった。\n(2)正答。国内におけるいろいろな動物愛護団体などの熱心な働きかけがあったところに海外からの批判を受けて、人と動物の関わりに関する基本法として「動物の保護及び管理に関する法律（現在の動物の愛護及び管理に関する法律）」が制定された。しかし、法律を具現化していくために必要な組織、人材、手段、資金などの裏付けがないままのスタートとなったことから、実際に運用していくうえでは多くの問題を抱えていた。\n(3)動物愛護会や日本人道会は、戦後まもなくに解散をした。\n(4)現在、動物の愛護及び管理に関する法律に「動物愛護週間」が9月20日から26日と定められているが、この法律が制定される前は、GHQの指示により、春分の日が「動物愛護デー」とされて、各地で動物愛護の催しが開催されていたが、のちに秋分の日を中心とする1週間に変更された。\n(5)兵庫県南部地震（阪神淡路大震災）がきっかけとなり、緊急災害時動物救援本部（後のペット災害対策推進協会）」が設立され、平時の備えや災害時における飼い主とそのペットの救護活動が推進・普及されてきた。", "supplement": "【語呂/ストーリー】『環境』は自然や生き物のルール担当。動物愛護管理もここ。迷ったら『動物愛護＝環境省』で固定。 【ストーリー】動物愛護管理法は“飼い主の教科書”。虐待を止めて、ちゃんと飼って、人と動物が仲良く暮らすための基本ルール。家庭動物の話はまずこの法律に戻る。"}, {"q": 11, "problem": "第二次世界大戦後の日本の主な動物愛護団体の活動に関する次の記述のうち、最も妥当なものを1つ選びなさい。", "choices": [{"no": 1, "text": "(2級教本第2編第2章第5節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "(1)正答。考え方や活動の方向性に異なる部分はあるが、環境省などとも連携・協力をしながら、動物愛護週間行事、マイクロチップの普及、災害時の動物救援活動を一緒に実施してきている。\n(2)公益社団法人日本獣医師会は、学術雑誌の刊行や研修会の開催などによる獣医学の振興・普及、人材育成や獣医学教育に関する政策提言、世界の獣医師会との情報交換などを行っている団体である。\n(3)現在、公益社団法人日本愛玩動物協会、公益社団法人日本獣医師会、公益財団法人日本動物愛護協会、公益社団法人日本動物福祉協会以外にも多数の動物愛護団体があるが、多くは1990年代以降に設立された団体であり、それぞれに独自の活動を行っている。\n(4)公益法人であることから、環境省などの行政機関とも連携・協力をしながら、動物愛護週間行事、マイクロチップの普及、災害時の動物救援活動を一緒に実施してきている。\n(5)（選択肢）公益社団法人日本愛玩動物協会は、動物の愛護と適正な飼養管理の知識を普及することを通じて、その結果として、動物が捨てられたりすることがないようにしていこうとする原因療法的な教育活動を行う団体である。", "supplement": "【語呂/ストーリー】『公益＝みんなのため』『社団＝人が集まる』。そこに“お墨付き（認定）”が付くのが公益社団法人。だから“国の機関”じゃなくて『民間チーム＋公益認定』。 【語呂/ストーリー】『環境』は自然や生き物のルール担当。動物愛護管理もここ。迷ったら『動物愛護＝環境省』で固定。"}, {"q": 12, "problem": "動物愛護の思想に関する次の記述のうち、最も妥当なものを1つ選びなさい。", "choices": [{"no": 1, "text": "バランシング・ポイントとは、動物の権利は人間と同等であることを世に知らしめようという運動のことである。"}, {"no": 2, "text": "動物の福祉（アニマル・ウェルフェア）と動物の権利（アニマル・ライツ）と称される考え方を区別する整理の仕方は、欧米では、紀元前からあったものである。"}, {"no": 3, "text": "アニマル・アドボケートとは、動物の権利は人間と同等であることを世に知らしめようという思想のことである。"}, {"no": 4, "text": "動物の権利（アニマル・ライツ）と称されている思想では、動物の食肉利用を否定しているが、愛玩利用や実験利用については肯定する考え方が一般的である。"}, {"no": 5, "text": "動物の福祉（アニマル・ウェルフェア）と称されている思想では、動物を利用することは否定しないが、動物に対して、快適さの確保と苦痛の解消を努力する義務と責任があるとする考え方が一般的である。\n【正答】"}, {"no": 5, "text": "(2級教本第2編第2章第7節）参照。"}], "answer_no": 5, "answer_raw": "(5)", "explanation": "(1)「愛玩動物は飼育するが肉は口にしたくない」などといったように、動物権利論と動物福祉論の間のどこかに置かれることとなる各個人の考え方の均衡点のことである。\n(2)この2つの考え方が区別して整理されるようになったのは、近年のことである。\n(3) 動物の立場を理解し、世に知らしめる代理人のことである。\n(4) 動物の権利（アニマル・ライツ）と称されている思想では、実験利用や時には愛玩利用についても否定的に考えられている。\n(5) 正答。", "supplement": "アニマル・ウェルフェアは『使うことはゼロにしない。でも苦痛は減らす』の考え方。覚え方は“Welfare＝Well（よく）＋Fare（扱う）＝気持ちよく扱え”。一方ライツ（Rights）は『権利』なので、実験や食肉にまで強く否定が広がりやすい、と方向性で区別すると迷わない。"}, {"q": 13, "problem": "ペットの終末期医療と看取りに関する次の記述のうち、最も妥当なものを1つ選びなさい。", "choices": [{"no": 1, "text": "犬や猫の寿命が30年間でほぼ2倍に伸びたのは、遺伝子工学の発達による品種改良、都市化の進展による衛生環境の改善が主な理由であると考えられている。"}, {"no": 2, "text": "クオリティ・オプ・ライフ(QOL)とは、動物が病気になったときに、獣医師が飼い主に対して十分な情報提供を行い、飼い主はそれを理解したうえで今後の治療方法を選択することにより、治療の質的水準を高めることである。"}, {"no": 3, "text": "「尊厳死」と「安楽死」は同義語であり、その実施についてはさまざまな課題があることから、日本では、人についてもペットについても実際に適用ざれた事例はない。"}, {"no": 4, "text": "グリーフケアとは、近しい人を亡くした悲嘆（グリーフ）から立ち直る過程を支援する取り組みを指す。もともとは人の医療において生まれた考え方であるが、現在では、ペットに関しても同様の考え方が浸透してきている。"}, {"no": 5, "text": "インフォームド・コンセントとは、病気になったときに、治療効果や延命期間の長短だけを評価するのではなく、精神的・肉体的・社会的な満足が維持できる生活ができるかといった点についても十分に考慮する考え方のことである。\n【正答】"}, {"no": 4, "text": "(2級教本第2編第2章第10節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "(1)犬と猫の寿命はこの30年間でほぼ2倍に伸びた。獣医療の発達、ペットフードの普及や品質向上、飼育技術の向上などが主な理由である。\n(2)文は、インフォームド・コンセント(IC)の説明である。QOLとは、病気になったときに、治療効果や延命期間の長短だけを評価するのではなく、精神的·肉体的・社会的な満足が維持できる生活ができるかといった点についても十分に考慮する考え方のことである。\n(3)安楽死と尊厳死とは、似ているが別の言葉である。安楽死は、化学的方法（例：麻酔薬の過剰投与など）や物理的方法（例：電撃など）により苦痛等を軽減することに着目した概念であり、尊厳死は、人としての尊厳やQOLを維持することに着目した概念である。\n(4)正答。\n(5)インフォームド・コンセントとは、動物が病気になったときに、獣医師が飼い主に対して十分な情報提供を行い、飼い主はそれを理解したうえで今後の治療方法を選択することにより、治療の質的水準を高めることである。選択肢は、クオリティ・オブ・ライフ(QOL)の説明である。", "supplement": "用語を“病院の受付”で覚えると早い。インフォームド・コンセントは『説明して→納得して→選ぶ』の手続き、QOLは『その子の生活の満足度（しんどさ・楽しさ）』の物差し。グリーフケアは“残された人の心のケア”。だから正解は『悲嘆から立ち直る支援』の④に一直線でOK。"}, {"q": 14, "problem": "次の語句は、動物を適切に飼うための考え方の「5つの自由」である。空欄［A］～［C］に入る語句の組み合わせで、妥当なものを選びなさい。\n\n飢え・［A］からの自由\n恐怖・抑圧からの自由\n［B］からの自由\n本来の行動がとれる自由\n痛み・［C］・病気からの自由", "choices": [{"no": 1, "text": "［A］排泄・［B］不快・［C］悲しみ"}, {"no": 2, "text": "［A］渇き・［B］不快・［C］負傷"}, {"no": 3, "text": "［A］排泄・［B］殺処分・［C］悲しみ"}, {"no": 4, "text": "［A］渇き・［B］殺処分・［C］負傷"}, {"no": 5, "text": "［A］排泄・［B］不快・［C］悲しみ\n【正答】"}, {"no": 2, "text": "(2級教本第2編第2章第2節、第4章第1~4節）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "「5つの自由」とは、「飢え・渇きからの自由」「不快からの自由」「痛み・負傷・病気からの自由」「本来の行動がとれる自由」「恐怖・抑圧からの自由」のことである。", "supplement": "「5つの自由」は“水・住・痛”の3点から埋めると速い。①飢え→セットは『渇き』、②住まいの話は『不快（暑い寒い・汚い）』、③痛みのセットは『負傷』。残りは『恐怖』と『本来行動』で完成。合言葉は『渇き・不快・負傷』。"}, {"q": 15, "problem": "災害への備えに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "災害時には、直ちに動物救援活動が開始されるので、ペット用の備蓄品などの準備は必要ない。"}, {"no": 2, "text": "ペットの個体識別の方法は、今のところ首輪や迷子札より優れたものはない。"}, {"no": 3, "text": "平時にペットの同行避難の準備をしていれば、ペットの預け先を事前に考える必要はない。"}, {"no": 4, "text": "同行避難時の避難所などでは、命あるものであるペットを優先した避難生活が保障されている。"}, {"no": 5, "text": "ペットの予防医療を含めた健康管理やしつけができていることが、災害への備えとして大切である。\n【正答】"}, {"no": 5, "text": "(2級教本第2編第4章第5節）参照。"}], "answer_no": 5, "answer_raw": "(5)", "explanation": "(1)災害時に直ちに救援活動が開始されるとは限らないため、ペットを飼い始めたら、災害時に備えてペット用の備蓄品の準備をしておく必要がある。\n(2)鑑札や迷子札などは、首輪と一緒になくなってしまうおそれがあるため、体内に埋め込むマイクロチップが有効な個体識別の方法となる。\n(3)同行避難後、状況によってはペットと共に避難し続けることが困難な場合があるため、平時から万が一のときの預け先を考えておく必要がある。\n(4)避難所ではペットを飼っていない人などと一緒になることもあるため、周りに気を配りながらの飼養となり、ペット飼養のマナーが重要な問題となる。\n(5)正答。", "supplement": "災害の問題は“避難所の現実”が舞台。救援はすぐ来ないし、首輪は外れる、避難所はペット優先ではない。だから『平時から健康管理としつけができている』⑤が一番強い。逆に「準備いらない」「首輪が最強」「預け先不要」「ペット優先が保障」みたいな断言は、現場を知らない言い方＝×と覚えると早い。"}, {"q": 16, "problem": "産業動物に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "産業動物の福祉の向上は、産業動物の健康の維持に役立つが、生産性の向上や畜産物の安全とは無関係である。"}, {"no": 2, "text": "バタリーケージ方式によるニワトリの飼養は、骨格のぜい弱化による羽折れの問題の防止に効果がある。"}, {"no": 3, "text": "アロメトリー式という計算式によって、群飼などの集約畜産をする場合に必要となる飼育施設の面積を算出することができる。"}, {"no": 4, "text": "国際獣疫事務局(WOAH)は、産業動物の福祉についての規制と取り締まりを行っている機関であり、現在、日本は加盟を検討中である。"}, {"no": 5, "text": "畜産行政は農林水産省が所管しているが、産業動物の福祉については、環境省が動物の愛護及び管理に関する法律に基づいて取り締まりを行っている。\n【正答】"}, {"no": 3, "text": "(2級教本第2編第5章）参照。"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "(1)生産性の向上や安全な畜産物の生産にも貢献するものである。\n(2)バタリーケージ方式による飼養では、羽ばたきなどが困難になることから、骨格のぜい弱化による羽折れなどの問題を引き起こす危険性が高くなる。\n(3)正答。\n(4)国際獣疫事務局(WOAH)は、産業動物の福祉や疾病防止などに関する情報提供や調査分析、国際的な規約（基準）のとりまとめを主な目的としている機関で、日本も加盟をしている。\n(5)産業動物の福祉に関する行政は、農林水産省が中心になって行っている。農林水産省では、国際獣疫事務局(WOAH)がとりまとめている産業動物の福祉に関する国際的な規約（基準）を踏まえて、基本的な考え方や飼養管理・施設環境・栄養·輸送に関する指針を作成・公表している。", "supplement": "【語呂/ストーリー】『環境』は自然や生き物のルール担当。動物愛護管理もここ。迷ったら『動物愛護＝環境省』で固定。 【ストーリー】動物愛護管理法は“飼い主の教科書”。虐待を止めて、ちゃんと飼って、人と動物が仲良く暮らすための基本ルール。家庭動物の話はまずこの法律に戻る。"}, {"q": 17, "problem": "動物の愛護及び管理に関する法律における実験動物の福祉に関する次の記述のうち、最も妥当なものを1つ選びなさい。", "choices": [{"no": 1, "text": "動物実験のガイドラインの基本理念とされる「3Rの原則」とは、可能な限り動物を使わなくてすむ「代替法」に代えること(Replacement)、実験に供する動物の数をできる限り減らすこと(Reduction)、動物が受ける苦痛を減らすこと(Refinement)の3つである。"}, {"no": 2, "text": "む「3Rの原則」のうち、苦痛の軽減（Refinement)と使用動物数の削減(Reduction)は動物愛護の観点から環境大臣が基準を定めて遵守指導を図ることが妥当とされている。"}, {"no": 3, "text": "「3Rの原則」は、実験動物のうち、哺乳類のみにあてはまるものとされ、爬虫類、鳥類では遵守する必要はない。"}, {"no": 4, "text": "動物実験のガイドラインの基本理念とされる「3Rの原則」とは、動物実験は「動物の愛護及び管理に関する法律」に反する行為であることから、時間をかけて徐々に動物実験を削減することをねらいとしたものである。"}, {"no": 5, "text": "動物の愛護及び管理に関する法律では、実験動物の安楽死については規定していない。\n【正答】"}, {"no": 1, "text": "(2級教本第2編第6章）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "(1)正答。1950年代にウィリアム・ラッセルとレックス・バーチの2人の科学者が提唱した理念である。\n(2)動物愛護の観点からその遵守指導を図ることが妥当とされているのは苦痛の軽減（Refinement)である。\n(3)「動物の愛護及び管理に関する法律」第41条に明確に規定されている。\n(4)「3Rの原則」とは、可能な限りほかの方法「代替法」に代えること(Replacement)、実験に供する動物の数をできるだけ減らすこと(Reduction)、動物がこうむる苦痛を減らすこと(Refinement)の3つであり、動物実験自体を動物愛護に反する行為とするものではない。\n（5）規定している。", "supplement": "【ストーリー】動物愛護管理法は“飼い主の教科書”。虐待を止めて、ちゃんと飼って、人と動物が仲良く暮らすための基本ルール。家庭動物の話はまずこの法律に戻る。"}, {"q": 18, "problem": "展示動物の動物福祉に関する次の記述のうち、最も妥当なものを1つ選び、解\n答用紙の解答欄にマークしなさい。", "choices": [{"no": 1, "text": "動物園での動物福祉では、動物が負の状態から脱するだけでなく、快適に暮らせるような、正の状態に向かうことを促進する努力が必要である。"}, {"no": 2, "text": "動物福祉における「5つの自由」と「5つの領域」は、同時に発表された。"}, {"no": 3, "text": "動物園では野生動物が生息している環境を再現することは、必要ではない。"}, {"no": 3, "text": "動物福祉向上における展示動物の環境エンリッチメントとは、負の状態を解消することである。"}, {"no": 4, "text": "目に見えない熱環境は、動物福祉の対象にはならない。\n【正答】"}, {"no": 1, "text": "(2級教本第2編第7章第1節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "(1)正答。動物園では、負の状況からの脱却を図る「5つの自由」とともに、正の福祉を追求する「5つの領域」の実現が求められている。\n(2)福祉の「5つの領域」は、産業動物に対して提言されていた「5つの自由」の考え方をメローらが発展させたもので、2015年に世界動物園水族館協会によって取り入れられた。\n(3)自然環境で見られる土、岩、水、植物などを効果的に配することが、動物福祉を充実させる環境をつくる\n(4)。動物福祉はどの時点における状態も、乏しい状態から良い状態までの連続線上にあり、負の状態を解消させて、正の状態を目指すことが必要である。\n(5)熱環境は動物福祉にとって、きわめて重要である。植栽による緑化は気温を下げるのに大きな役割を果たす。", "supplement": "超要約：(1)正答。動物園では、負の状況からの脱却を図る「5つの自由」とともに、正の福祉を追求する「5つの領域」の実現が求められている。 覚え方：『展示動物→動物福祉』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 19, "problem": "展示動物の環境エンリッチメントに関する次の記述のうち、最も妥当なものを1つ選び、なさい。", "choices": [{"no": 3, "text": "(2級教本第2編第7章第2節）参照。"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "(1)野生と異なる飼育下での環境は、退屈な環境を強いており、単調さを回避させるために、野生に近い環境を提供することが求められる。\n(2)動物が慣れてしまうことなく、新たな環境を提供することも求められる。\n(3)正答。高所空間を引きだすものには、樹木、擬木、枯木、鉄塔などがあり、夏季の高温時に熱を伝えることのない、熱伝導率の低い素材が求められる。\n(4)採食時間を長くすることが重要で、餌を隠し、それを探させることが重要である。\n(5)動物は嗅覚に優れており、特定の動物のニオイを感じさせることは、感覚エンリッチメントとして効果的である。", "supplement": "超要約：(1)野生と異なる飼育下での環境は、退屈な環境を強いており、単調さを回避させるために、野生に近い環境を提供することが求められる。 (3)正答。高所空間を引きだすものには、樹木、擬木、枯木、鉄塔などがあり、夏季の高温時に熱を伝えることのない、熱伝導率の低い素材が求められる。 覚え方：『展示動物→環境』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 20, "problem": "動物の体の仕組みに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "細胞小器官の中の小胞体は細胞分裂のときに両極に分かれて染色体の分裂に関係する。"}, {"no": 2, "text": "哺乳類にだけにみられる毛は、体温を保ち、皮膚を保護するが、感覚器としての働きはしない。動物の体を構成する組織は、その機能の違いから、上皮組織、結合組織、筋肉組織および神経組織の4種類に分類される。"}, {"no": 3, "text": "皮膚腺の一種である汗腺はエクリン腺とアポクリン腺からなるが、それらの体表分布は動物種による違いはない。"}, {"no": 4, "text": "筋肉は随意筋と不随意筋に分けられ、平滑筋と心筋は随意筋に属する。\n【正答】"}, {"no": 2, "text": "(2級教本第3編第1章）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "小胞体は物質の合成（主にたんぱく質と脂質）と輸送の働きをする。\n毛には感覚器の働きをもつ触毛（感覚毛）がある。\n正答。\n人はエクリン腺が全身に分布しているが、ほかの哺乳類はアポクリン腺が全身に分布している。\n平滑筋と心筋は、自分の意思とは関係なく動く不随意筋である。", "supplement": "超要約：小胞体は物質の合成（主にたんぱく質と脂質）と輸送の働きをする。 毛には感覚器の働きをもつ触毛（感覚毛）がある。 正答。 覚え方：『仕組→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 21, "problem": "動物の体の仕組みと働きに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 4, "text": "(2級教本第3編第2章）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "(1)膵臓は膵液という消化液を十二指腸に分泌するので、消化器系に含まれる。\n(2)唾液には、プチアリンという消化酵素が含まれる。\n(3)42本、猫30本、ウサギ28本である。\n(4)正答。\n(5)肝静脈ではなく門脈を通って肝臓に運ばれる。", "supplement": "超要約：(4)正答。 (5)肝静脈ではなく門脈を通って肝臓に運ばれる。 覚え方：『仕組→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 22, "problem": "動物の体の仕組みと働きに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 4, "text": "(2級教本第3編第3章）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "(1)腎臓で尿が生成される仕組みは、腎小体によるろ過と尿細管による再吸収である。\n(2)鳥類はアンモニアを尿酸に変えて体外に排出している。\n(3)尿は尿管を通り膀胱に送られ、尿道を通って排出される。\n(4)正答。\n(5)体内の水分の調整には、腎臓が血液をろ過し、尿として排出することが大きく関与している。", "supplement": "超要約：(4)正答。 覚え方：『仕組→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 23, "problem": "動物の体の仕組みと働きに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 2, "text": "(2級教本第3編第4章）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "赤血球、白血球、血小板などを新生する骨髄の造血作用は骨格の役割の一つである。\n正答。\n関節の存在により、骨はさまざまな動きが可能になっている。\n骨に付着し、骨格を動かす筋肉を骨格筋という。\n骨格筋の筋肉は、多数の筋束で構成されている。", "supplement": "超要約：赤血球、白血球、血小板などを新生する骨髄の造血作用は骨格の役割の一つである。 正答。 関節の存在により、骨はさまざまな動きが可能になっている。 覚え方：『仕組→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 24, "problem": "動物の体の仕組みと働きに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 5, "text": "(2級教本第3編第5章）参照。"}], "answer_no": 5, "answer_raw": "(5)", "explanation": "視覚：目の位置などによって異なる。聴覚：動物種により可聴範囲が異なる。嗅覚：人の嗅覚はかなり退化しているが、ほかの哺乳類ではよく発達している。\n猫などの薄明薄暮性の動物や、夜行性の動物の眼が夜に光るのは、網膜の外側にタペタムと呼ばれる反射層が発達しているからである。\n耳は聴覚器官であるが、その内耳には平衡感覚器官も組み合わされている。平衡感覚器は2つあり、ひとつは姿勢のバランスを感知する前庭器官、もうひとつは体の複雑微妙な動きを感じ取る三半規管である。\n味覚や嗅覚は、刺激の程度の違いよりも、主に化学物質の種類の違いを感じ取る。\n正答。", "supplement": "超要約：視覚：目の位置などによって異なる。聴覚：動物種により可聴範囲が異なる。嗅覚：人の嗅覚はかなり退化しているが、ほかの哺乳類ではよく発達している。 猫などの薄明薄暮性の動物や、夜行性の動物の眼が夜に光るのは、網膜の外側にタペタムと呼ばれる反射層が発達しているからである。 耳は聴覚器官であるが、その内耳には平衡感覚器官も組み合わされている。平衡感覚器は2つあり、ひとつは姿勢のバランスを感知する前庭器官、もうひとつは体の複雑微妙な動きを感じ取る… 覚え方：『仕組→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 25, "problem": "動物の生殖器と形態と機能に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "脊椎動物の哺乳類や鳥類、両生類は、交接器（交尾器）を使って雌の体内で受精を行う体内受精である。"}, {"no": 2, "text": "哺乳類の多くは、卵を体内で孵化させてから産む卵胎生である。"}, {"no": 3, "text": "ホルモンは内分泌腺でのみ分泌されて、リンパ液とともに全身に運ばれ、作用すべき器官に達する。"}, {"no": 4, "text": "哺乳類の雌にみられる性周期は、卵巣から分泌される卵胞ホルモンと黄体ホルモンの働きにより制御されている。"}, {"no": 5, "text": "前立腺は哺乳類の雌の生殖器の一部である。\n【正答】"}, {"no": 4, "text": "(2級教本第4編第1章）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "(1)脊椎動物の哺乳類や鳥類、爬虫類が、交接器（交尾器）を使って雌の体内で受精を行う体内受精である。それに対して両生類は体外受精である。\n(2)哺乳類の多くは、体内で胎子を育ててから産み落とす胎生である。\n(3)ホルモンは自律神経と内分泌腺で分泌され、血液とともに全身に運ばれて、作用すべき器官（標的器官という）に達する。\n(4)正答。\n(5)雄の生殖器の一部である。", "supplement": "超要約：(4)正答。 覚え方：『生殖器→形態』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 26, "problem": "犬の繁殖生理に関する次の記述のうち、正しいものを1つ選び、解答用紙の解\n答欄にマークしなさい。", "choices": [{"no": 2, "text": "(2級教本第4編第2章）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "雌には明瞭な発情期がある。\n正答。\n交尾をすると排卵が起こるのは猫である。\n出産が迫ったときに乳汁が出るが、偽妊娠で乳汁が出ることもある。\n発情前期には、雄は雌の尿中のフェロモンに引き寄せられるが、雌はまだ交尾を許容しない。", "supplement": "超要約：雌には明瞭な発情期がある。 正答。 交尾をすると排卵が起こるのは猫である。 覚え方：『繁殖生理→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 27, "problem": "猫の繁殖生理に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 2, "text": "(2級教本第4編第3章）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "猫は交尾排卵動物である。\n正答。\nこうした行動は、雌猫特有のもので、雄猫にはみられない。\n猫の妊娠期間は63日前後である。\nこのような行動は雄猫にはみられるが、雌猫にはみられない。", "supplement": "超要約：猫は交尾排卵動物である。 正答。 こうした行動は、雌猫特有のもので、雄猫にはみられない。 覚え方：『繁殖生理→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 28, "problem": "子猫の行動の発達段階と社会化に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "(2級教本第5編第1章第1節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "正答。\n早期母子分離を避け、愛情深い母猫に8週齢くらいまで育てさせ、社会化期（2、3〜9週齢ごろまで）に、人間をはじめ、一生涯生きていくために出会うさまざまな動物や事柄に慣らす必要がある。\n同上\n3~4週齢までの子猫は、母猫が陰部を舐める刺激で排泄する（泌尿生殖器反射）。\n猫の社会化期は、2、3〜9週齢頃までといわれ、それまでに人に慣らすことが大切である。", "supplement": "超要約：正答。 早期母子分離を避け、愛情深い母猫に8週齢くらいまで育てさせ、社会化期（2、3〜9週齢ごろまで）に、人間をはじめ、一生涯生きていくために出会うさまざまな動物や事柄に慣らす必要がある。 同上 覚え方：『子猫→行動』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 29, "problem": "犬のコミュニケーションに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 5, "text": "(2級教本第5編第1章第3節）参照。"}], "answer_no": 5, "answer_raw": "(5)", "explanation": "(1)対立感情共存は恐れと攻撃が混じった状態で、どちらが勝るというものではないため、攻撃に転じることもある。\n(2)犬も猫も同じように恐怖や不安な気持ちになると瞳孔は拡大する。\n(3) 恐れの気持ちが強まると、体を小さくして、体重は後ろにかかる（逃げたい気持ち）。\n(4)お腹をなでてほしくて横転する犬もいるが、受動的服従姿勢の際にもお腹を見せる（受動的服従姿勢のときには視線はけっしてこちらに向けず、耳は後ろに倒れ、尾は腹部に巻き込む）\n（5）正答。", "supplement": "超要約：(1)対立感情共存は恐れと攻撃が混じった状態で、どちらが勝るというものではないため、攻撃に転じることもある。 （5）正答。 覚え方：『コミュニケーション→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 30, "problem": "猫のコミュニケーションに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "(2級教本第5編第1章第3節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "(1)正答。\n(2)猫が相手に尾を垂直に上げて接近する行動は、親和行動としてよく見られる。\n(3)猫が恐怖を示すときには、犬のように尾を鼠径部に巻き込むようなことはしない。体を小さくして尾は体にぴたっと揃えるようにして巻きつける。\n(4)猫は、犬に比較すると表情の変化はわかりにくい。目が大きく正面にあるため、瞳孔の拡大や縮小はわかりやすいかもしれない。\n（5）猫は、犬のようにうれしいときに尾を振ることはない。", "supplement": "超要約：(1)正答。 (4)猫は、犬に比較すると表情の変化はわかりにくい。目が大きく正面にあるため、瞳孔の拡大や縮小はわかりやすいかもしれない。 （5）猫は、犬のようにうれしいときに尾を振ることはない。 覚え方：『コミュニケーション→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 31, "problem": "犬と猫の嗅覚的コミュニケーションに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "犬の足指の間の「汗腺」から出る分泌物は、体温調節にのみ関わるものであり、嗅覚信号物質ではない。"}, {"no": 2, "text": "ネズミなどでは、「フェロモン」もコミュニケーション信号になっているが、犬や猫ではフェロモンによるコミュニケーションは行わない。"}, {"no": 3, "text": "「フェロモン」は、動物の組織で生産され、体外に分泌放出されて、他種の個体に特有な行動などを起こさせる化学物質である。く正犬や猫の尿によるマーキングは、一般的に雄のほうが頻度はかなり高いが、雌では発情期に頻度が高くなる。"}, {"no": 4, "text": "嗅覚信号は、時間が経過した後にその信号を伝えるために使用され、近接個体間でのコミュニケーションには使用されない。\n【正答】"}, {"no": 4, "text": "(2級教本第5編第1章第3節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "(1)足指の間の「汗腺」も嗅覚信号になっていると考えられている。\n(2)犬や猫でもフェロモンによるコミュニケーションが行われていることが明らかになっている。\n(3)フェロモンは、同種の他個体に特有な行動などを起こさせる動物の組織で生産される化学物質である。\n(4)正答。\n（5）猫のこすりつけ行動や犬のお尻を嗅ぎあう挨拶行動など、嗅覚信号は、近接個体間のコミュニケーションにも使用される。", "supplement": "超要約：(4)正答。 （5）猫のこすりつけ行動や犬のお尻を嗅ぎあう挨拶行動など、嗅覚信号は、近接個体間のコミュニケーションにも使用される。 覚え方：『嗅覚的→コミュニケーション』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 32, "problem": "猫の社会に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 4, "text": "(2級教本第5編第1章第3節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "(1)雌は食物を確保できる広さをなわばりにし、雄は食物だけでなく、配偶関係を確保するために複数の雌のなわばりを含む広さのなわばりを構える。\n(2)ネコ科の動物は基本的には単独性のなわばりを構えて暮らすが、例外もあり、ライオンなどは、プライドという群れを作る。イエネコも食べ物が豊富である場合、なわばりが緩くなり共同生活をするようになる。\n(3)なわばりの大きさは、食べ物の豊富さに関係する。\n(4)正答。\n(5)子別れの仕方は、子の性別によって異なっており、雄、すなわち息子は、母親のなわばりから遠くまで放浪していく。一方、娘は母親のそばになわばりを構えたり、母親のなわばりと一部重複するようになわばりを構えたりする傾向がある。", "supplement": "超要約：(1)雌は食物を確保できる広さをなわばりにし、雄は食物だけでなく、配偶関係を確保するために複数の雌のなわばりを含む広さのなわばりを構える。 (4)正答。 覚え方：『社会→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 33, "problem": "条件づけの方法に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "犬に食事を与える直前にベルの音を聞かせると、ベルの音を聞いただけで唾液を分泌するようになる。このような反応をするようになることを「オペラント条件づけ」という。"}, {"no": 2, "text": "「古典的条件づけ」による反応は、一度条件づけられた行動は、一生忘れることはない。"}, {"no": 3, "text": "動物にとって満足がもたらされる反応は刺激と組み合わさって起こりやすくなるが、こうした「結果によってその行動が変化する」という法則は、古典的条件づけの原理ともなっている。"}, {"no": 4, "text": "「オペラント条件づけ」では、行動に何らかの結果が伴うことで、その後の行動が増えることを「強化」、逆に行動が減ることを「罰」という。"}, {"no": 5, "text": "「オペラント条件づけ」による反応は、一度条件づけられた行動は、一生忘れることはない。\n【正答】"}, {"no": 4, "text": "(2級教本第5編第2章第3節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "(1)「オペラント条件づけ」ではなく「古典的条件づけ」。ある条件刺激に対して、直接関係のない条件反応を獲得することを「古典的条件づけ」という。\n(2)条件づけられた反応は、同じ条件づけが定期的に繰り返されなければ次第に消えていく（古典的条件づけの消去）。\n(3)「古典的条件づけ」ではなく「オペラント条件づけ」。「オペラント条件づけ」とは、反応（行動）が環境を変化させる操作的機能といえる。\n(4)正答。\n(5)「古典的条件づけ」でも「オペラント条件づけ」でも、同じ条件づけが繰り返されなければ条件反応は次第に消えていく。", "supplement": "超要約：(1)「オペラント条件づけ」ではなく「古典的条件づけ」。ある条件刺激に対して、直接関係のない条件反応を獲得することを「古典的条件づけ」という。 (3)「古典的条件づけ」ではなく「オペラント条件づけ」。「オペラント条件づけ」とは、反応（行動）が環境を変化させる操作的機能といえる。 (4)正答。 覚え方：『条件→方法』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 34, "problem": "犬のしつけに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "犬は初めから指示語を知らないので、まずは補助的な刺激を用いてその「動作」を教えていく。これにはリードを引き寄せて「オイデ」を教える身体的誘導法や、食べ物を鼻先から頭の上に動かして「オスワリ」を教えるルアー・トレーニング法がある。"}, {"no": 2, "text": "お尻を押すなどの身体的誘導法は、虐待につながるので絶対に使用してはいけない。"}, {"no": 3, "text": "手やルアーなどのプロンプトを漸進的に増やしていくことをフェイデイングという。"}, {"no": 4, "text": "一度報酬として食べ物を使ったら、その行動をさせるために毎回食べ物を与え続けなければならない。"}, {"no": 5, "text": "犬の反応の確実性は、場所や状況が変わっても変化しないのが普通である。\n【正答】"}, {"no": 1, "text": "(2級教本第5編第3章）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "(1)正答。\n(2)乱暴な身体的誘導法（乱暴にリードを一気に引き寄せる、お尻を思いっきり強く押すなど）は犬の学習に支障をきたし、後でいろいろな弊害が出ることがあるので薦められないが、犬が怖がったり嫌がったりしないようにやさしく誘導すれば、効果的に使用することができる。\n(3)プロンプトを漸進的に省略していく過程をフェイデイングという。\n(4)行動の消去抵抗を上げるためにも、強化スケジュールは連続強化スケジュールで行動が定着したら、部分（間欠）強化スケジュールに変えていく。\n(5)犬の反応の確実性は場所や状況が変わると変化する。そのためさまざまな場所や状況で練習することでその行動を般化（普遍化）していくことが必要である。", "supplement": "超要約：(1)正答。 (4)行動の消去抵抗を上げるためにも、強化スケジュールは連続強化スケジュールで行動が定着したら、部分（間欠）強化スケジュールに変えていく。 (5)犬の反応の確実性は場所や状況が変わると変化する。そのためさまざまな場所や状況で練習することでその行動を般化（普遍化）していくことが必要である。 覚え方：『記述→乱暴』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 35, "problem": "犬のしつけに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "条件づけを成立させる「報酬」は、その動物にとってうれしいことであればよく、食べ物である必要はない。飼い主になでられたり、飼い主や家族に喜んでもらえたり、あるいは自分がしたいと思っていたことが達成されたりすることも「報酬」となり得るので、条件づけによる学習を成立させる。"}, {"no": 2, "text": "「部分（間欠）強化スケジュール」では犬はすばやく学習するが、「連続強化スケジュール」とは異なり、ごほうびがないと次第にやらなくなる。"}, {"no": 3, "text": "犬がその指示を理解するようになったあと「報酬」を断続的に与えるのは、犬が食べ物に対していやしくならないようにするためである。"}, {"no": 4, "text": "犬が何か好ましいことをしたときに「報酬」を与えるようにすると、そのときに学習したことは一生保持され、忘れることはない。"}, {"no": 5, "text": "犬が何か好ましくないことをしたときには、十分に時間が経ってから罰を与えたほうが効果的である。\n【正答】"}, {"no": 1, "text": "(2級教本第5編第3章）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "(1)正答。\n(2)行動が定着するまでは連続強化スケジュールのほうが動物は早く学習するが、定着した後は、その強化を断続的にしていく部分（間欠）強化スケジュールのほうが行動の消去抵抗は上がることがわかっている。\n(3)部分（間欠）強化スケジュールは行動の消去抵抗を上げるために行う方法であり、食べ物にいやしくなるから引き上げるのではない。\n(4)学習は忘却することがある。一生保持され忘れることがない学習はない（「刷り込み」は一生保持される）。\n(5)罰を行使する場合は即座に罰を与える必要があるが、副作用も多いので叱ることを主体にしたトレーニングは薦められない。", "supplement": "超要約：(1)正答。 (3)部分（間欠）強化スケジュールは行動の消去抵抗を上げるために行う方法であり、食べ物にいやしくなるから引き上げるのではない。 覚え方：『記述→行動』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 36, "problem": "猫の行動と習性に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "猫は、家ではほとんど寝ているので、オモチャは基本的に必要ない。"}, {"no": 2, "text": "垂直面よりも平面の広さを重要視するので、生活の場に高さのある空間は必要ない。"}, {"no": 3, "text": "猫は、好奇心旺盛で活動的な動物なので、たとえ猫同士でケンカを起こしたとしても、退屈な室内飼いに比べれば自由に外に出してあげたほうがよい。"}, {"no": 4, "text": "猫は尿だけでなく、爪とぎもマーキングの意味で行うことがある。"}, {"no": 5, "text": "猫は、清潔好きであり、自分の身体をなめて毛づくろいしているので、プラッシングなどの毛の手入れは必要ない。\n【正答】"}, {"no": 4, "text": "(2級教本第5編第4章）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "(1)猫には狩猟本能があり、安全でスリルのない退屈な生活を補うためにオモチャが必要である。\n(2)猫は上下運動をするため、平面よりも高さのある空間を好み、高い場所で安心感も得るので、生活の場には高さのある空間が必要である。\n(3)猫の外出は、交通事故、ケンカによるケガや感染症へのリスク、また排泄物などで近所迷惑になることも考えられるので、完全室内飼育が基本である。\n(4)正答。\n(5)猫は、セルフグルーミング（自分の毛をなめる）をするが、その毛を飲み込んだ結果、その毛が胃腸に詰まったりする（毛球症）などの問題が起こることがある。特に長毛種はセルフグルーミングだけでは被毛を整えることがむずかしいので、子猫の頃からプラッシングに慣れさせることは大切である。", "supplement": "超要約：(1)猫には狩猟本能があり、安全でスリルのない退屈な生活を補うためにオモチャが必要である。 (2)猫は上下運動をするため、平面よりも高さのある空間を好み、高い場所で安心感も得るので、生活の場には高さのある空間が必要である。 (4)正答。 覚え方：『持ち込まない・広げない』。経路と対策（隔離/消毒/報告）をセットで。"}, {"q": 37, "problem": "猫の適切な飼養に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "外で排泄することが習慣になっている成猫にトイレを教えるためには、あらかじめ排泄物そのものをトイレに置くようにするとよい。"}, {"no": 2, "text": "猫は清深なトイレを好むため、排泄物のすくい取りは週1回程度行い、トイレの砂の全取り替えは少なくとも月1回行う。\n（3）雄猫がトイレ以外で排泄する原因はすべてマーキングであるので、去勢手術さえすれば雄猫の排泄問題はすべて解決する。"}, {"no": 4, "text": "すべての猫は、適切なトイレを用意すれば、必ずその中で自然に排泄する。\n（5）猫下部尿路疾患などによって、排泄時の痛みのためにトイレで排泄しなくなった猫は、病気が改善した後もトイレを使わなくなる場合がある。\n【正答】"}, {"no": 5, "text": "(2級教本第5編第4章）参照。"}], "answer_no": 5, "answer_raw": "(5)", "explanation": "(1)外で排泄することが習慣になっている成猫にトイレを教えるために、あらかじめ排泄物そのものをトイレに置くことは、逆効果になることが多い。\n(2)猫は清潔なトイレを好むため、排泄物のすくい取りは朝と晩の1日2回行い、トイレの砂の全取り替えは少なくとも1~2週間に1回行う。\n(3)トイレ以外で排泄する原因には、トイレが汚れている、マーキング、病気（膀胱炎や尿石症など）、精神的な問題などがあるので、去勢手術をすれば猫の排泄問題がすべて解決するわけではない。\n（4）ほとんどの猫は、適切なトイレを用意すればその中で自然に排泄するようになるが、保護された猫やトイレを使わない母猫に育てられた子猫はトイレトレーニングが必要な場合もある。\n（5）正答。", "supplement": "超要約：(1)外で排泄することが習慣になっている成猫にトイレを教えるために、あらかじめ排泄物そのものをトイレに置くことは、逆効果になることが多い。 (2)猫は清潔なトイレを好むため、排泄物のすくい取りは朝と晩の1日2回行い、トイレの砂の全取り替えは少なくとも1~2週間に1回行う。 （4）ほとんどの猫は、適切なトイレを用意すればその中で自然に排泄するようになるが、保護された猫やトイレを使わない母猫に育てられた子猫はトイレトレーニングが必要な場合も… 覚え方：『適切→飼養』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 38, "problem": "日本の法令に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 4, "text": "(2級教本第6編第1章第1節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "(1)国会の議決を経て制定される。1つの条文を細かく分けて書くときには、「条」の下に「項」や「号」が置かれる。\n(2)政令は内閣により制定される。\n(3)国会での審議や議決、閣議決定の必要はなく、関係大臣が制定する。\n(4)正答。\n(5)国会の承認を得たうえで、「批准」という形で国内的に効力が発生し、条約が批准された場合は、その条約に関する国内での取り組みとして「関係法令」が制定される。", "supplement": "超要約：(4)正答。 覚え方：『日本→法令』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 39, "problem": "次の法律・条約のうち、飼養動物を主な対象としている法律・条約のみをあげているものを1つ選びなさい。", "choices": [{"no": 4, "text": "(2級教本第6編第1章第2節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "問題文に列記されている法律のうち、飼養動物を主な対象としている法律は、動物の愛護及び管理に関する法律、狂犬病予防法、家畜伝染病予防法、身体障害者補助犬法、愛がん動物用飼料の安全性の確保に関する法律である。", "supplement": "【ストーリー】動物愛護管理法は“飼い主の教科書”。虐待を止めて、ちゃんと飼って、人と動物が仲良く暮らすための基本ルール。家庭動物の話はまずこの法律に戻る。 【語呂/ストーリー】『狂犬病＝犬（けん）』で名前のまんま。犬の登録と注射がセット。犬が出たらこの法律が第一候補。 【語呂/ストーリー】“補助犬＝人を助ける犬”。盲導・介助・聴導の3兄弟。『補助犬＝3犬（さんけん）』って覚えておくと出題で迷いにくい。"}, {"q": 40, "problem": "「動物の愛護及び管理に関する法律」の「目的」「基本原則」「所有者や占有者の責任」に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "「目的」「基本原則」「所有者や占有者の責任」の対象となる動物は、ペットなどの家庭動物に限定されており、実験動物や産業動物は対象となっていない。"}, {"no": 2, "text": "この法律の主な目的は「動物の愛護」であり、動物の虐待防止と適切な取り扱いの推進により、命あるものである動物の尊厳と人格の保護を目指している。"}, {"no": 3, "text": "基本原則の中には「動物をみだりに殺傷したり、苦しめたりしてはならない」といった規定があり、産業動物の肉を食べることは「みだりな殺傷」に該当すると考えられている。"}, {"no": 4, "text": "この法律では、「飼い主」という用語は使われておらず、「所有者」「占有者」という表現になっている。飼い主は「所有者」に該当し、一時的に動物を預かることになるトリミングサロンのトリマーなどが「占有者」に該当する。"}, {"no": 5, "text": "この法律が定めている所有者や占有者の責任には、「みだりな繁殖を防止するための不妊・去勢手術の実施」や「逸走（いっそう）の防止」があるが、「感染症の知識の習得や予防」はない。\n【正答】"}, {"no": 4, "text": "(2級教本第6編第2章第1節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "飼育動物全般（家庭動物、展示動物、実験動物、産業動物など）が対象となっている。\nこの法律は、「動物の愛護（適正飼養や虐待防止など）」と「動物の適切な管理（危害や迷惑の防止など）」をすることで、人と動物が共生する社会の実現を図ることを目的とする。\n正当な理由（緊急の場合や人間生活を維持するうえでの必要性）があれば、みだりな殺傷には当たらないとされている。\n正答。\n「動物の健康と安全の保持、危害や迷惑の防止、感染症の知識や予防、所有の明示措置、逸走の防止、終生飼養、みだりな繁殖の防止」が定められている。", "supplement": "【ストーリー】動物愛護管理法は“飼い主の教科書”。虐待を止めて、ちゃんと飼って、人と動物が仲良く暮らすための基本ルール。家庭動物の話はまずこの法律に戻る。"}, {"q": 41, "problem": "「動物の愛護及び管理に関する法律」の「動物の飼養及び保管に関する基準」に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "飼い主などが守らなければならない責任や飼い方を具体的に示したものであるが、罰則を伴うような強制措置ではなく、「よるべき基準としてのガイドライン」になっている。"}, {"no": 2, "text": "人とのふれあいや客よせを目的として飼養・保管される動物（哺乳類・鳥類・爬虫類）に対しては、「家庭動物等の飼養及び保管に関する基準」が適用される。"}, {"no": 3, "text": "家庭動物や展示動物を対象とした基準については環境大臣によって制定されるが、産業動物を対象とした基準については農林水産大臣によって制定される仕組みになっている。"}, {"no": 4, "text": "「家庭動物等の飼養及び保管に関する基準」の「学校、福祉施設等における飼養及び保管」には、教育の効果を上げるために、「できるだけ異種・複数の動物を一緒に飼育すること」や「地域住民を含む誰もが自由に食べ物を与えられるようにすること」などが定められている。"}, {"no": 5, "text": "「実験動物」を対象として定められた基準は、実験動物の苦痛軽減と飼養・保管方法が密接に関連するものであることから、「動物実験中の苦痛の軽減」や「動物実験に利用された後の安楽殺処分」の基準を含めて、一つの基準として定められている。\n【正答】"}, {"no": 1, "text": "(2級教本第6編第2章第1節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "(1)正答。\n(2)「展示動物の飼養及び保管に関する基準」が適用される。\n(3)「産業動物の飼養及び保管に関する基準」も、環境大臣によって定められる仕組みとなっている。\n(4)「異種・複数の動物を一緒に飼育する場合は、組み合わせに注意すること」や「飼養管理者以外の人が、みだりに食べ物を与えられないようにすること」などが定められている。\n(5)物実験中の苦痛の軽減」を含む基準として「実験動物の飼養及び保管並びに苦痛の軽減に関する基準」が定められているが、「動物実験に利用された後の安楽殺処分」については、畜産動物なども対象となる「動物の殺処分方法に関する指針」として別に定められている。", "supplement": "【ストーリー】動物愛護管理法は“飼い主の教科書”。虐待を止めて、ちゃんと飼って、人と動物が仲良く暮らすための基本ルール。家庭動物の話はまずこの法律に戻る。"}, {"q": 42, "problem": "「動物の愛護及び管理に関する法律」の「動物の飼養及び保管に関する基準」に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "「ペットショップで販売している犬や猫」は、展示動物ではなく、産業動物に該当する。"}, {"no": 2, "text": "猫の屋内飼育に努める理由は、猫自身の不慮の事故防止のためであるとされており、病気の防止や周辺環境の保全のためであることは理由とされていない。"}, {"no": 3, "text": "放し飼いをしないようにするだけでなく、犬を係留する場合は、係留されている犬の行動範囲が、道路または通路に接しないように配慮することが定められている。"}, {"no": 4, "text": "ウサギを学校で飼養する場合は、「展示動物の飼養及び保管に関する基準」を遵守しなければならないこととされている。"}, {"no": 5, "text": "基準ごとに対象動物は異なり、産業動物についての基準では「哺乳類・鳥類」、展示動物についての基準では「哺乳類・鳥類・爬虫類・両生類・昆虫などのすべての動物種」であるとされている。\n【正答】"}, {"no": 3, "text": "(2級教本第6編第2章第1節）参照。"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "(1)展示動物に該当する。\n(2)「猫の健康と安全、周辺の生活環境の保全」のためであると明記されている。\n(3)正答。\n(4)「家庭動物等の飼養及び保管に関する基準」を遵守しなければならない。\n(5)「展示動物・家庭動物・実験動物」についての基準では哺乳類・鳥類・爬虫類、「産業動物」についての基準では哺乳類・鳥類とされている。", "supplement": "【ストーリー】動物愛護管理法は“飼い主の教科書”。虐待を止めて、ちゃんと飼って、人と動物が仲良く暮らすための基本ルール。家庭動物の話はまずこの法律に戻る。"}, {"q": 43, "problem": "「動物の愛護及び管理に関する法律」の「所有の明示措置」に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "産業動物（畜産動物）の場合と異なり、ペットについては、「所有の明示措置を推進すること」と「トレーサビリティの確保を通じたペットの流通の適正化を図ること」とは、無関係であると考えられている。"}, {"no": 2, "text": "「動物の愛護及び管理に関する法律」や「狂犬病予防法」では、所有の明示を義務づける措置が一部に設けられている。"}, {"no": 3, "text": "所有の明示の手段として、人れ墨（タトゥー）や脚環は推奨されていない。"}, {"no": 4, "text": "マイクロチップとは、体に影響を与えない生体適合の合金で覆われた円筒形のGPS装置である。"}, {"no": 5, "text": "マイクロチップのICチップには、15桁の数字からなる個体識別番号のほかに、飼い主の氏名・住所・連絡先や動物の種類・生年月日などが登録されている。\n【正答】"}, {"no": 2, "text": "(2級教本第6編第2章第1節）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "(1) 盗難や迷子の防止だけでなく、責任の所在の明確化による動物の遺棄や逸走の未然防止、トレーサビリティの確保を通じたペットの流通の適正化などにも役立つものであると考えられている\n(2)正答「動物の愛護及び管理に関する法律」では、犬猫等販売業者の所有する犬または猫にマイクロチップを装着し指定登録機関に登録すること、および特定動物（危険な動物）の飼養許可にあたってはマイクロチップなどによる個体識別が、「狂犬病予防法」では犬の登録と鑑札の装着が義務づけられている。\n(3)入れ墨（タトゥー）、鳥類への脚環の装着も有効な方法として推奨されている。\n(4)生体適合のガラスやポリマーで覆われた円筒形の電子標識器具である。なお、ペットの位置を知らせるGPS機能はない。\n(5)マイクロチップは個体識別番号のみが記録されているため、装着しただけでは意味がなく、別途管理されているデータベースに、飼い主の氏名・住所・連絡先や動物の種類・生年月日などのデータを登録する必要がある。", "supplement": "【ストーリー】動物愛護管理法は“飼い主の教科書”。虐待を止めて、ちゃんと飼って、人と動物が仲良く暮らすための基本ルール。家庭動物の話はまずこの法律に戻る。 【語呂/ストーリー】『狂犬病＝犬（けん）』で名前のまんま。犬の登録と注射がセット。犬が出たらこの法律が第一候補。"}, {"q": 44, "problem": "「動物の愛護及び管理に関する法律」の「罰則」に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "(2級教本第6編第2章第1節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "(1)正答。懲役刑と罰金刑が、罰則として設けられている。\n(2)哺乳類・鳥類·爬虫類であれば、実験動物や畜産動物も対象になる。\n(3)野生化し、山野で自活しているノイヌ・ノネコは野生動物にあたるが、もともと人が飼養していたものが飼い主の手を離れて放浪している野良犬や野良猫は、愛護動物に含まれると考えられている。\n(4)飼養者個人が所有している動物に対する虐待であっても、罰則が適用されることがある。\n（5）不適切な飼育により周辺の生活環境が損なわれていた場合には勧告や命令が出されるが、命令に従わなかった場合は、罰則が適用されることがある。", "supplement": "【ストーリー】動物愛護管理法は“飼い主の教科書”。虐待を止めて、ちゃんと飼って、人と動物が仲良く暮らすための基本ルール。家庭動物の話はまずこの法律に戻る。"}, {"q": 45, "problem": "日団「動物の愛護及び管理に関する法律」の「特定動物」に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "特定動物は、「毒・爪牙による殺傷力」「物理的な圧力」「攻撃性向」といった危害の程度、国内における飼養実態などを総合的に勘案して選定されている。"}, {"no": 2, "text": "ニホンザル・オオワシ・キタキツネは、いずれも特定動物に指定されている。"}, {"no": 3, "text": "特定動物は、各地域の実情に合わせて都道府県知事が定めている。"}, {"no": 4, "text": "動物園や動物実験施設については、特定動物の飼養・保管の規制の対象施設から除外されている。"}, {"no": 5, "text": "特定動物の飼養・保管は届出制となっており、飼養・保管を始めてから30日以内に都道府県知事などに対する届出を行うことが義務づけられている。\n【正答】"}, {"no": 1, "text": "(2級教本第6編第2章第1節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "(1)正答。\n(2)ニホンザル・オオワシは特定動物であるが、キツネは異なる。\n(3)特定動物は、以前は都道府県によって異なっていたが、現在は全国一律であり地域差はない。\n(4)動物園や動物実験施設であっても許可が必要である。ただし、特定動物の診療を行う動物病院や動物検疫所は規制の適用から除外されている。\n(5)事前に都道府県知事などの許可を受ける必要がある。なお、愛玩目的での飼養は原則的には禁止されている。", "supplement": "【ストーリー】動物愛護管理法は“飼い主の教科書”。虐待を止めて、ちゃんと飼って、人と動物が仲良く暮らすための基本ルール。家庭動物の話はまずこの法律に戻る。"}, {"q": 46, "problem": "「動物の愛護及び管理に関する法律」の「周辺の生活環境の保全等」に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "都道府県知事などは、鳴き声などによって周辺の生活環境が損なわれている場合については改善の勧告だけを実施することができ、動物虐待のおそれがあると認められる場合については改善の勧告・命令の両方を実施することができるとされている。"}, {"no": 2, "text": "「動物の毛の周辺への飛散」「人と動物の共通感染症の発生」は、周辺の生活環境が損なわれている事態の対象になる場合がある。"}, {"no": 3, "text": "「栄養不良の個体がみられ、動物への給餌給水が適切に行われていないこと」は、動物が衰弱する等の虐待を受けるおそれがある事態の対象から除外されている。"}, {"no": 4, "text": "鳴き声などによって周辺の生活環境が損なわれている場合や動物虐待のおそれがあると認められる場合は、必ず改善の勧告が行われてから、次に改善勧告を守るように命令が行われる。"}, {"no": 5, "text": "鳴き声などによって周辺の生活環境が損なわれている場合と動物虐待のおそれがあると認められる場合の改善の勧告や命令は、1頭によるものであっても実施されることがある。\n【正答】"}, {"no": 5, "text": "(2級教本第6編第2章第1節）参照。"}], "answer_no": 5, "answer_raw": "(5)", "explanation": "(1)都道府県知事などは、鳴き声などによって周辺の生活環境が損なわれている場合や動物虐待のおそれがあると認められる場合には、改善のための勧告・命令を実施することができることとされている。\n(2)鳴き声などの騒音、悪臭、毛や羽毛の飛散、ネズミやハエなどの発生の4種類の事態に限定されている。\n(3)給餌給水を怠ることのほかにも、異常な鳴き声、汚物による悪臭、爪の異常な伸びや動物の体表の著しい汚れ、繁殖過多などの事態が該当するとされている。\n(4)鳴き声などによって周辺の生活環境が損なわれている場合は、まず改善の勧告が行われてから、次に改善がされなかった場合に命令が行われる。一方、動物虐待のおそれがあると認められる場合は、改善の勧告なしでも命令を行うことができることとされている。\n(5)正答。いずれの場合も「多数の動物によること」が前提となっていたが、2019（令和元）年の法改正により、1頭でも勧告・命令を行うことができるようになった。", "supplement": "【ストーリー】動物愛護管理法は“飼い主の教科書”。虐待を止めて、ちゃんと飼って、人と動物が仲良く暮らすための基本ルール。家庭動物の話はまずこの法律に戻る。"}, {"q": 47, "problem": "「愛がん動物用飼料の安全性の確保に関する法律」に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 3, "text": "(2級教本第6編第2章第2節）参照。"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "(1)愛玩動物用飼料の安全性の確保による動物の健康の保護と動物の愛護への寄与が目的であり、製造方法や表示についての基準や成分規格などが定められている。価格はもちろんのこと、給餌方法（種類・量・頻度など）などについての定めはない。\n(2)愛玩動物を対象とした法律であるが、現時点での対象は、政令によって犬と猫に限定されている。なお、将来的には、犬や猫以外の愛玩動物にも拡大されることもある。\n(3)正答。オヤツ、スナック、ガム、サプリメント、ミネラルウォーターも含まれる。\n(4)農林水産大臣と環境大臣への届出が必要とされている。\n(5)成分規格・製造方法・表示方法・基準に合わない飼料の廃棄や回収に関する規制がある。また、罰則や関係職員による立入検査の仕組みも設けられている。", "supplement": "超要約：(3)正答。オヤツ、スナック、ガム、サプリメント、ミネラルウォーターも含まれる。 覚え方：『動物用飼料→安全性』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 48, "problem": "「狂犬病予防法」に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 4, "text": "(2級教本第6編第2章第3節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "(1)東南アジア諸国でも発生している。\n(2)狂犬病はすべての哺乳類に感受性があるが、登録と予防注射は犬にのみ適用、輸出入検疫は犬・猫・あらいぐま・きつね・スカンクの5種が対象動物となっている。なお、狂犬病はすべての恒温動物に感染の可能性があるとされ、鳥類では狂犬病に感染した小型哺乳類から感染したと推測される猛禽類の報告がある。\n(3)登録と鑑札装着の両方が義務づけられている。この登録は、取得してから原則として30日以内とされている。ただし、生後90日以内の犬は、生後91日目から数えて30日以内に登録することとなる。\n(4)正答。\n(5)「放浪犬（野良犬・野犬）、未登録犬、未注射犬」を捕獲·収容できる仕組みがある。また、犬·猫・あらいぐま・きつね・スカンクの5種には、輸出入検疫が義務づけられている。", "supplement": "【語呂/ストーリー】『狂犬病＝犬（けん）』で名前のまんま。犬の登録と注射がセット。犬が出たらこの法律が第一候補。"}, {"q": 49, "problem": "「身体障害者補助犬法」に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 3, "text": "(2級教本第6編第3章第1節）参照。"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "(1)身体障害者を補助するための犬の育成と、その犬を使用する身体障害者が、犬を伴って施設等を利用する場合の円滑化を図ることによって、身体障害者の自立と社会参加を促進することが目的である。\n(2)厚生労働大臣が指定した法人（訓練施設等）から認定を受けた「盲導犬・聴導犬・介助犬の3種類の犬」は、補助犬に該当する。\n(3)正答。\n(4)特定の会社では、その会社の社員である身体障害者が同伴してきた補助犬を拒んではならないことされている。補助犬の同伴を拒んだ場合の罰則はなく、罰則の適用は補助犬の訓練事業者に関するものだけになっている。\n(5)補助犬の使用者は補助犬を適切に管理できる能力を有するとともに、必要事項を記載した表示を補助犬につける義務があるが、試験や研修を受けたりすることを義務づける仕組みはない。", "supplement": "【語呂/ストーリー】“補助犬＝人を助ける犬”。盲導・介助・聴導の3兄弟。『補助犬＝3犬（さんけん）』って覚えておくと出題で迷いにくい。"}, {"q": 50, "problem": "「廃棄物の処理及び清掃に関する法律」と「化製場等に関する法律」に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 2, "text": "(2級教本第6組第3章第2節）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "(1)廃棄物は「一般廃棄物」と「産業廃棄物」に区分されており、一般家庭のペットの死体は「汚物や不要物」として取り扱われる場合は「一般廃棄物」になり、動物霊園等に埋葬される場合は廃棄物ではないものとして取り扱われる。\n(2)正答。\n(3)—般家庭から出るごみなどの一般廃棄物は、市町村による処理が原則であるが、事業活動に伴って生じた廃棄物のうち定められたものは産業廃棄物である。産業廃棄物の処理は、事業者自らが行うのが原則である。\n(4)政令で定められた「牛、馬、豚、めん羊、山羊、犬、鶏、アヒル」についてのみの規制であるが、各都道府県知事によって「指定された地域」で「指定された頭数以上」を飼養する場合に限っては、許可を受けることが必要とされている。\n(5)「獣畜」として定義されているのは、牛、馬、豚、めん羊、山羊の5種であり、この5種の死体についてはペットとして飼われていたものであっても「死亡獣畜取扱場」で処理することとされている。なお、動物の死体が産業廃棄物になるのは、畜産農業に関わる場合である。", "supplement": "超要約：(2)正答。 覚え方：『廃棄物→処理及』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 51, "problem": "「特定外来生物による生態系等に係る被害の防止に関する法律」に関する次のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "「特定外来生物」として指定されている動物に、カミッキガメは含まれていない。"}, {"no": 2, "text": "特定外来生物」に指定できる動物は、哺乳類・鳥類・爬虫類・魚類に属する動物種に限定されている。"}, {"no": 3, "text": "「特定外来生物」に指定されている動物は、飼養や輸入が規制されるとともに、野外に放つことも厳しく規制される。"}, {"no": 4, "text": "外来生物による被害には、生態系への被害はあるが、農林水産業や人の生命・身体への被害はないとしている。"}, {"no": 5, "text": "「特定外来生物」の防除は、危険や困難が伴うことから、国が主体となって行うこととされており、地方公共団体や民間団体が参加しての実施は禁止されている。\n【正答】"}, {"no": 3, "text": "(2級教本第6編第4章第2節）参照。"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "(1)ヵミツキガメ、アライグマ、タイワンザル、オオクチバス（プラックバス）などが含まれている。\n(2)特段の限定はない。また、現時点では、哺乳類・鳥類・爬虫類・魚類だけでなく、昆虫類なども指定されている。\n(3)正答。なお、「特定外来生物」に指定される前からペットとして飼っていた動物については、許可を得て引き続き飼うことができる仕組みがあるが、新たに別の個体を飼うことはできないとされている。\n(4)生態系（在来種の捕食・競合や遺伝子かく乱など）、農林水産業（食害など）、人の生命・身体への被害があり、これらの被害を防止するために特定外来生物法が制定されている。\n(5)国のほか、地方公共団体・民間団体などの参加により防除を促進することとされている。", "supplement": "超要約：(3)正答。なお、「特定外来生物」に指定される前からペットとして飼っていた動物については、許可を得て引き続き飼うことができる仕組みがあるが、新たに別の個体を飼うことはできないとされている。 (4)生態系（在来種の捕食・競合や遺伝子かく乱など）、農林水産業（食害など）、人の生命・身体への被害があり、これらの被害を防止するために特定外来生物法が制定されている。 覚え方：『特定外来生物→生態系等』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 52, "problem": "「絶滅のおそれのある野生動植物の種の保存に関する法律」に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "「絶滅のおそれがある状態」の中には、「著しいスピードで個体数が減少していても、種の存続に支障をきたすほどの数までは減っていない状態」は含まれないとされている。"}, {"no": 2, "text": "環境大臣が種の保存を緊急に図る必要があると認めた野生動植物については緊急指定種に指定することができるが、一度指定をしたら解除することはできないとされている。"}, {"no": 3, "text": "国内希少野生動植物種は、ワシントン条約に掲載されている種が指定される。"}, {"no": 4, "text": "希少野生動植物種の個体だけでなく、象牙などの器官も規制対象となっている。"}, {"no": 5, "text": "国内希少野生動植物については捕獲や譲渡が規制されており、学術研究の場合であっても捕獲や譲渡をすることは認められていない。\n【正答】"}, {"no": 4, "text": "(2級教本第6編第4章第3節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "(1)「個体の数が著しく減少しつつある状態（種の存続に支障をきたすほどの数まで減っていない場合も含む）」や、「生息・生育環境が著しく悪化しつつある状態」なども、「絶滅のおそれがある状態」であるとされている。\n(2)緊急指定種は、緊急的な措置として環境大臣が指定するものであり、その指定期間は3年を超えてはならないとされている。その後、必要があると判断された場合には、所定の手続きを経て、国内希少野生動植物種などに指定されることとなる。\n(3)「環境省版レッドリスト（絶滅のおそれのある野生生物の種のリスト）」の中から指定される。主にワシントン条約に掲載されている中から指定されるのは、国際希少野生動植物種である。\n(4)正答。個体、卵、種子、器官の一部、加工品などが規制対象となっている。\n(5)捕獲や譲渡は原則として禁止されている。ただし、学術研究や繁殖の目的で、種の存続に影響がないものとして環境大臣の許可を受けた場合は捕獲等ができる。", "supplement": "【語呂/ストーリー】『環境』は自然や生き物のルール担当。動物愛護管理もここ。迷ったら『動物愛護＝環境省』で固定。"}, {"q": 53, "problem": "「鳥獣の保護及び管理並びに狩猟の適正化に関する法律」に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "目的には、外来種による生態系の悪化の防止、捕獲した野生動物の適正飼養の推進を図ることが規定されている。"}, {"no": 2, "text": "野生の鳥類と哺乳類を対象とした法律であることから、ドブネズミやクマネズミ、ニホンアシカやクジラ類なども規制の対象になっている。"}, {"no": 3, "text": "野生の鳥獣を捕獲してペットとして飼養する場合には、捕獲許可を得るとともに、飼養登録も受けなければならないこととされている。"}, {"no": 4, "text": "販売禁止鳥獣に指定されているヤマドリとオオタカの販売規制は、生体の状態で販売する場合に限って適用される。"}, {"no": 5, "text": "鳥獣の輸出にあたっては、すべての野生鳥獣（卵やはく製等の加工品を含む）について、環境大臣の交付する「適法捕獲証明書」を添付することが義務づけられている。また、輸入にあたっても同様である。\n【正答】"}, {"no": 3, "text": "(2級教本第6編第4章第4節）参照。"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "(1)この法律は、鳥獣の保護及び管理並びに狩猟の適正化を図り、もって生物の多様性の確保、生活環境の保全及び農林水産業の健全な発展に寄与することを通じて、自然環境の恵沢を享受できる国民生活の確保及び地域社会の健全な発展に資することを目的とする。\n(2)ドブネズミやクマネズミ、クジラ類などは規制の対象から除外されている。\n(3)正答。なお、こういった制度はあるが、現在は原則として許可しない方針が明示されている。\n(4)ャマドリとオオタカは、養殖したものや卵を含めて規制対象となっている。また、ヤマドリについては、美味であるとされる肉の流通を規制するために、生体や食料品としての加工状態で販売する場合は規制を受けるが、はく製等の場合は除外されている。\n(5)鳥獣の輸出入にあたっては、すべての鳥獣ではなく、環境大臣の指定する鳥獣（卵やはく製等の加工品を含む）に限って規制を受ける。輸出をする場合には、環境大臣の交付する適法捕獲証明書の添付が義務づけられている。輸入をする場合には原産地国の政府等が発行する原産地国の法律に違反して捕獲したものではないことを証明する書類の原則的な添付や脚環の装着（特定輸入鳥獣のみ）が義務づけられている。特定輸入鳥獣以外の鳥獣についてはマイクロチップ等による個体識別を義務づける仕組みは設けられていない。", "supplement": "超要約：(3)正答。なお、こういった制度はあるが、現在は原則として許可しない方針が明示されている。 (4)ャマドリとオオタカは、養殖したものや卵を含めて規制対象となっている。また、ヤマドリについては、美味であるとされる肉の流通を規制するために、生体や食料品としての加工状態で販売する場合は規制を受けるが、はく製等の場合は除外されている。 (5)鳥獣の輸出入にあたっては、すべての鳥獣ではなく、環境大臣の指定する鳥獣（卵やはく製等の加工品を含む）に限… 覚え方：『鳥獣→保護及』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 54, "problem": "「自然環境保全法」「自然公園法」「文化財保護法」に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "「自然環境保全法」は優れた自然環境の「保護と利用」を目的としている。また、原生自然環境保全地域は環境大臣が指定し、自然環境保全地域と都道府県自然環境保全地域は都道府県知事が指定する仕組みになっている。"}, {"no": 2, "text": "日本の自然環境の現況や改変状況を把握するために行われている「自然環境保全基礎調査（通称：緑の国勢調査）」は、「自然公園法」に基づいて国土地理院によって実施されている。"}, {"no": 3, "text": "国立公園の特別保護地区においてはすべての動物を対象として、特別地域においては環境大臣が指定する動物を対象として、捕獲や殺傷が規制されている。"}, {"no": 4, "text": "タンチョウやニホンカモシカは、「文化財保護法」によって天然記念物に指定されているが、特別天然記念物には指定されていない。"}, {"no": 4, "text": "「天然記念物」は都道府県知事や市町村長が指定し、特に重要なものは文部科学大臣が「特別天然記念物」に指定する仕組みになっている。\n【正答】"}, {"no": 3, "text": "(2級教本第6編第4章第5~7節）参照。"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "(1)原生自然環境保全地域と自然環境保全地域は環境大臣が指定、都道府県自然環境保全地域は都道府県が指定する仕組みになっている。なお、「自然公園法」は、優れた自然の風景地を保護するとともにその利用の増進を図ることによって国民の保健・休養・教化に役立てること、生物の多様性の確保に寄与することを目的としている。\n(2)自然環境保全基礎調査は、「自然環境保全法」に基づいて環境省によって実施されている。\n(3)正答。なお、「自然公園」には、国立公園、国定公園、都道府県立自然公園の3種類があり、国立公園と国定公園は環境大臣、都道府県立自然公園は都道府県知事が指定する。\n(4)タンチョウやニホンカモシカは、特別天然記念物に指定されている。\n(5)特別天然記念物と天然記念物は、いずれも文部科学大臣が指定する。指定された野生動物については、捕獲したり、飼養したり、販売したりすることが禁止される。", "supplement": "【語呂/ストーリー】『環境』は自然や生き物のルール担当。動物愛護管理もここ。迷ったら『動物愛護＝環境省』で固定。"}, {"q": 55, "problem": "自然環境保全（野生動物の保護を含む）の関連条約に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "「ワシントン条約」は、水鳥の生息地として重要な湿地の保全を主眼とした条約である。"}, {"no": 2, "text": "「ラムサール条約」は、「絶滅のおそれのある野生動植物の種の国際取引に関する条約」のことである。"}, {"no": 3, "text": "「生物の多様性に関する条約」は、外来生物による被害の防止を主眼とした条約である。"}, {"no": 4, "text": "「バイオセーフティに関するカルタヘナ議定書」は、生態系・種・遺伝子の多様性の保全を定めた議定書である。"}, {"no": 5, "text": "日本が諸外国と締結している「渡り鳥などの保護条約及び協定」は、渡り鳥が行き来する二国間での締結が多い状況にある。\n【正答】"}, {"no": 5, "text": "(2級教本第6編第4章第8節）参照。"}], "answer_no": 5, "answer_raw": "(5)", "explanation": "(1)「ワシントン条約」とは、「絶滅のおそれのある野生動植物の種の国際取引に関する条約」のことである。\n(2)「ラムサール条約」とは、「特に水鳥の生息地として国際的に重要な湿地に関する条約」のことである。\n(3)「生物の多様性に関する条約」とは、生態系・種・遺伝子の多様性の保全を目的とした条約である。\n(4)「バイオセーフティに関するカルタヘナ議定書」とは、遺伝子組換え生物の利用に伴う生物多様性への影響を防止するため、輸出人手続き等に関して国際的な枠組みを定めた議定書である。\n(5)正答。", "supplement": "超要約：(4)「バイオセーフティに関するカルタヘナ議定書」とは、遺伝子組換え生物の利用に伴う生物多様性への影響を防止するため、輸出人手続き等に関して国際的な枠組みを定めた議定書である。 (5)正答。 覚え方：『絶滅しそう→売買の前に許可』＝ワシントン条約（CITES）。"}, {"q": 56, "problem": "動物との正しい関わり合い方に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "ペットを飼うにあたっては、飼養者の年齢、住環境、家族構成、収入などの条件を考慮する必要はない。"}, {"no": 2, "text": "の飼養管理にあたっては、食事と水を与えることが重要であり、日頃の観察は必要ではない。"}, {"no": 3, "text": "動物の飼養にあたっては、人間と愛玩動物の権利を同格化しないなどの節度ある飼養態度が大切である。"}, {"no": 4, "text": "動物に関する法律は制定されているが、条例は制定されていない。"}, {"no": 5, "text": "狂犬病の予防注射の実施と飼い犬の登録は、犬を室内で飼養する場合には不要である。\n【正答】"}, {"no": 3, "text": "(2級教本第7編第1章第1節）参照。"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "(1)飼養者の年齢、住環境、家族構成、収入などに見合った動物を選択することが大切である。\n(2)異常を早期に発見するためにも日常の観察は重要である。\n(3)正答。\n(4)動物に関する条例は、多くの都道府県等において制定されている。\n(5)狂犬病の予防注射の実施と飼い犬の登録は、犬を室内で飼養する場合でも必ず行わなければならない。", "supplement": "超要約：(2)異常を早期に発見するためにも日常の観察は重要である。 (3)正答。 覚え方：『記述→飼養者』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 57, "problem": "人や動物の病因論に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "(2級教本第7編第1章第2節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "正答。\n身体的、精神的に加えて社会的にも完全に良好な状態と定義している。\n多要因病因論ではなく、単一病因論と呼ばれる病因論を提案した。\n宿主の抵抗力が病因に比べて相対的に強いときには、何ら症状を示すことなく感染状態を続けることがあり、これを不顕性感染という。\n宿主要因、病因要因に加えて環境要因があげられる。", "supplement": "超要約：正答。 身体的、精神的に加えて社会的にも完全に良好な状態と定義している。 多要因病因論ではなく、単一病因論と呼ばれる病因論を提案した。 覚え方：『病因論→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 58, "problem": "動物の健康と疾病に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "宿主には、体内に病因物質が侵入してきたとき、この有害作用を防御する仕組みは備わっていない。"}, {"no": 2, "text": "体に感染したとき、宿主と病原体の間での攻防は、両者が置かれた環境の影響を受けない。"}, {"no": 3, "text": "ホメオスタシスとは、外部環境が変化しても内部環境をつねに一定に保とうとする生体の仕組みのことである。"}, {"no": 4, "text": "疾病は宿主、病因および環境の3要因の関わり合い（相互作用）の結果として生じるものである。これを疾病の単一病因論と呼ぶ。"}, {"no": 5, "text": "健康と疾病とは、相互に関わりのない独立した逆の関係にある現象である。\n【正答】"}, {"no": 3, "text": "(2級教本第7編第1章第2節）参照。"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "(1)そのような仕組みが備わっている。\n(2) 環境にも強く影響される。\n(3)正答。\n(4) 多要因病因論と呼ぶ。\n(5)健康と疾病の境目はつねに明確に示されるというものではない。", "supplement": "超要約：(3)正答。 覚え方：『健康→疾病』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 59, "problem": "感染防御能に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "抗体の多くは、微生物の感染を防御する働きを持っている。"}, {"no": 2, "text": "グロブリンにはいくつかの種類があるが、犬の場合は、その大部分が妊娠中に胎盤を通過して胎子に移行する。"}, {"no": 3, "text": "抗原抗体反応を起こす抗原は、細菌やウイルスなどの微生物が主体で、鶏卵などの食品は含まれない。"}, {"no": 4, "text": "母親から子犬に移行した抗体（移行抗体）は、生後6カ月で子犬の体内から消失しはじめる。"}, {"no": 5, "text": "細胞の中に寄生する性質を持つウイルスや一部の細菌に対しては、リンパ球に担われている液性免疫が感染防御の役を果たす。\n【正答】"}, {"no": 1, "text": "(2級教本第7編第1章第2節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "(1)正答。\n(2)妊娠中ではなく、主に分娩後の初乳を介して移行する。\n(3)抗原には鶏卵などの食品も含まれる。\n(4)生後6カ月ではなく、生後2~3カ月で子犬の体内から消失しはじめる。\n(5)液性免疫ではなく細胞性免疫。", "supplement": "超要約：(1)正答。 (2)妊娠中ではなく、主に分娩後の初乳を介して移行する。 (4)生後6カ月ではなく、生後2~3カ月で子犬の体内から消失しはじめる。 覚え方：『感染防御能→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 60, "problem": "消毒・滅菌法に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "イソプロパノールは、80~90％の濃度で使用する。"}, {"no": 2, "text": "両性石けんは、毒性が強く室温で長時間安定している。"}, {"no": 3, "text": "クレゾール石けん液は、殺菌力が強いわりに腐食性は低いが、有機物の存在下で有効性が著しく低下する。"}, {"no": 4, "text": "次亜塩素酸ナトリウムは殺菌力が強く、有機物の存在下でも効力は低下しにくい。"}, {"no": 5, "text": "消石灰は強アルカリ性による殺菌効果があり、動物舎や土壌などの消毒に使用される。\n【正答】"}, {"no": 5, "text": "(2級教本第7編第1章第2節）参照。"}], "answer_no": 5, "answer_raw": "(5)", "explanation": "(1)イソプロパノールは50~70％の濃度で使用する。\n(2)両性石けんの毒性は低い。\n(3)クレゾール石けん液は、有機物の存在下でも効力が低下しにくい。\n(4)次亜塩素酸ナトリウムは、有機物存在下で著しく効力が低下する。\n(5)正答。", "supplement": "超要約：(5)正答。 覚え方：『消毒→滅菌法』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 61, "problem": "動物の環境衛生に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "動物がおかれる環境の状態を左右する要因は、自然環境要因と人為的環境要因に大別される。"}, {"no": 2, "text": "自然環境要因には、日照、気温、湿度などの気候要因があげられるが、空気、水は含まれない。"}, {"no": 3, "text": "、各種ミネラル成分を多く含めば含むほど、飼養動物の飲料水として適している。"}, {"no": 4, "text": "動物を飼養する際の適正温度（気温）は、動物種で差異はなく、およそ18~28℃である。"}, {"no": 5, "text": "人為的環境要因には、動物の飼養場所（動物管理施設）は含まれない。\n【正答】"}, {"no": 1, "text": "(2級教本第7編第1章第3節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "(1)正答。\n(2)自然環境要因には、空気、水、土も含まれる。\n(3)各種ミネラル成分が極端に多い硬水は、飲料水として不適である。\n(4)飼養の適正温度は、動物種で差異があり、マウス、ラット、ハムスター、モルモットでは18~26℃、ウサギ、サル、猫、犬では18~28℃、熱帯産の爬虫類、両生類では30~40℃（サンショウウオでは10~16℃）とされている。\n(5)人為的環境要因には、動物の飼養場所も対象となる。", "supplement": "超要約：(1)正答。 覚え方：『環境衛生→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 62, "problem": "動物の管理衛生に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 5, "text": "(2級教本第7編第1章第4節）参照。"}], "answer_no": 5, "answer_raw": "(5)", "explanation": "犬も猫も、人と動物の共通感染症に罹患する危険性がある。\n室内飼育犬の飼養管理においては、適度な屋外運動と日光浴が必要である。\n収容密度が過密な状態で飼育すると、ストレスや感染症の感染拡散が問題となる。\n通気性と方向転換できる余裕のある輸送ケージを使用する。\n正答。", "supplement": "超要約：犬も猫も、人と動物の共通感染症に罹患する危険性がある。 室内飼育犬の飼養管理においては、適度な屋外運動と日光浴が必要である。 収容密度が過密な状態で飼育すると、ストレスや感染症の感染拡散が問題となる。 覚え方：『持ち込まない・広げない』。経路と対策（隔離/消毒/報告）をセットで。"}, {"q": 63, "problem": "犬の分類と歴史に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "(2級教本第7編第2章第1節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "正式な和名は「イエイヌ」とカタカナで記載する。\n正答。\n秋田犬のほかに甲斐犬、紀州犬、柴犬、四国犬、北海道犬が天然記念物に指定されている。\nオオカミは群れで暮らす習性がある。\n人間に飼われはじめた当初の犬は、狩りを手伝う狩猟犬であったと考えられている。", "supplement": "超要約：正式な和名は「イエイヌ」とカタカナで記載する。 正答。 秋田犬のほかに甲斐犬、紀州犬、柴犬、四国犬、北海道犬が天然記念物に指定されている。 覚え方：『分類→歴史』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 64, "problem": "犬の特徴に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 2, "text": "(2級教本第7編第2章第1節）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "犬の体長は胸骨端から坐骨端までの長さをいう。\n正答。\n犬は音として聞きとれる周波数の範囲が人間(20Hzから2万Hz)よりも広く、16Hzから12万Hzである。\n犬のほうが人間に比べ、ずっと高い高周波の音を聞くことができる。\n犬では乳歯の数は28本、永久歯の数は42本である。", "supplement": "超要約：犬の体長は胸骨端から坐骨端までの長さをいう。 正答。 犬は音として聞きとれる周波数の範囲が人間(20Hzから2万Hz)よりも広く、16Hzから12万Hzである。 覚え方：『特徴→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 65, "problem": "犬の特徴に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "(2級教本第7編第2章第1節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "犬の咬合力は人の数10倍あるといわれている。\n犬には鎖骨がないので、前肢を回したり広げたりすることはできない。\n犬の相状体は多数分布している。\n犬の錐状体の数は非常に少なく、色をはっきり識別できない。\n正答。", "supplement": "超要約：犬の咬合力は人の数10倍あるといわれている。 犬には鎖骨がないので、前肢を回したり広げたりすることはできない。 犬の相状体は多数分布している。 覚え方：『特徴→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 66, "problem": "猫の分類と歴史に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "(2級教本第7編第2章第2節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "猫の学名は「フェリス・カトゥス」である。「カニス・ファミリアリス」は犬の学名。\nライオンは例外で、プライドという群れをつくって生活する。\n猫の仲間はほぼ完全な肉食である。\nイエネコの祖先種はリビアヤマネコである。\n正答。", "supplement": "超要約：猫の学名は「フェリス・カトゥス」である。「カニス・ファミリアリス」は犬の学名。 ライオンは例外で、プライドという群れをつくって生活する。 猫の仲間はほぼ完全な肉食である。 覚え方：『分類→歴史』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 67, "problem": "猫の特徴に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "猫は生後1カ月以上経たないと嗅細胞が発達しないので、生まれてすぐの子猫は触覚にたよって母猫の乳首を探しあてる。"}, {"no": 2, "text": "猫の下顎前歯の下方には、鋤鼻器（ヤコプソン器官）という特殊な嗅覚器官がある。"}, {"no": 3, "text": "猫の瞳孔は犬と同様に、円形に縮小したり散大したりして、光の量を調節する。"}, {"no": 4, "text": "猫は人間が必要とする光量の6分の1程度の明るさでも物体を認識することができる。"}, {"no": 5, "text": "光の三原色のうち赤は認識できるが、青と緑は認識できない。\n【正答】"}, {"no": 4, "text": "(2級教本第7編第2章第2節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "(1)生後1週間ほどの子猫でも嗅細胞は多数発達しているため、嗅覚にたよって母猫の乳首を探しあてる。\n(2)鋤鼻器（ヤコプソン器官）は猫の上顎前歯の内側上方にある。\n(3)猫の瞳孔は縦長である。\n(4)正答。\n(5)猫は光の三原色のうち青と緑は認識できるが、赤は認識できないといわれている。", "supplement": "超要約：(1)生後1週間ほどの子猫でも嗅細胞は多数発達しているため、嗅覚にたよって母猫の乳首を探しあてる。 (4)正答。 覚え方：『特徴→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 68, "problem": "猫の特徴に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 2, "text": "(2級教本第7編第2章第2節）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "猫のひげは感情表現の道具でもある。\n正答。\n猫の五感の中で最も優れているのは聴覚である。\n前肢の指は5本であるが後肢の指は4本である。\n白毛で青い眼の猫は嗅覚ではなく聴覚に障害をもつものが多い。", "supplement": "超要約：猫のひげは感情表現の道具でもある。 正答。 猫の五感の中で最も優れているのは聴覚である。 覚え方：『特徴→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 69, "problem": "血統書に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 2, "text": "(2級教本第7編第2章第4節）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "毛色がある程度見定められるまで血統書の申請手続きを待つことがある。\n正答。\n骨格の評価やDNA登録番号は、飼育犬団体が必要に応じて記載するもので、すべての血統書に必ず記載されているものではない。\n新たな飼い主に所有権が移り、飼い主自身が申請することによって正式な飼い主として団体に登録されると、血統書の所有者襴が書き換えられる。\n犬の血統書に必要情報として記載される項目は大きく変わらないもの、祖先犬の特定の疾患につながる骨格の評価を記載している血統書など、飼育犬団体によって異なる部分もある。", "supplement": "超要約：毛色がある程度見定められるまで血統書の申請手続きを待つことがある。 正答。 骨格の評価やDNA登録番号は、飼育犬団体が必要に応じて記載するもので、すべての血統書に必ず記載されているものではない。 覚え方：『血統書→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 70, "problem": "次の記述のうち、「身体障害者補助犬法」における補助犬に該当する犬のみをあげているものを1つ選びなさい。", "choices": [{"no": 1, "text": "(2級教本第7編第3章）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "わが国において身体障害者補助犬法で公共交通機関やさまざまな施設へのアクセスが認められているのは盲導犬、聴導犬、および介助犬のみである。", "supplement": "【語呂/ストーリー】“補助犬＝人を助ける犬”。盲導・介助・聴導の3兄弟。『補助犬＝3犬（さんけん）』って覚えておくと出題で迷いにくい。"}, {"q": 71, "problem": "犬と暮らすうえで大切なことを述べた次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 4, "text": "(2級教本第7編第4章第1節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "初めての飼養で不安がある場合には、しつけと社会化がすんでいる健康な成犬を選ぶことで、犬との生活がより良いものになる可能性がある。\n午前中に迎えて、少しでも環境に慣れる時間を多くする配慮が必要である。\n庭など室外で飼養する場合、家族の姿が見えたり、声が聞こえたりする場所が理想的である。\n正答。\n寝床の周りをサークルで囲うと、犬は自分のなわばりを認識し、安心して眠るようになる。", "supplement": "超要約：初めての飼養で不安がある場合には、しつけと社会化がすんでいる健康な成犬を選ぶことで、犬との生活がより良いものになる可能性がある。 午前中に迎えて、少しでも環境に慣れる時間を多くする配慮が必要である。 庭など室外で飼養する場合、家族の姿が見えたり、声が聞こえたりする場所が理想的である。 覚え方：『大切→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 72, "problem": "犬と暮らすうえで大切なことを述べた次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "(2級教本第7編第4章第1節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "トイレ以外の場所で排泄をしたときは絶対に叱らず、ニオイが残らないように静かに後始末をする。\n危険防止のため、シートベルトで固定したケージに入れる。\n正答。\n室内飼育の場合は、伸びすぎた爪を畳や絨毯に引っかけて折ってしまうことがあるので、2週間ごとに確認をして、爪が伸びているようであれば切る必要がある。\n犬は人に比べて歯に歯垢や歯石がつきやすいため、歯磨きは毎日行う必要がある。", "supplement": "超要約：トイレ以外の場所で排泄をしたときは絶対に叱らず、ニオイが残らないように静かに後始末をする。 危険防止のため、シートベルトで固定したケージに入れる。 正答。 覚え方：『大切→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 73, "problem": "犬の健康管理に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "(2級教本第7編第4章第1節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "正答。\n心拍数は小型犬のほうが大型犬よりも多い。\n頭をひどく振る場合、まず耳の疾患を疑う。\n犬の平熱は人よりも高く、平均して38.5℃である。\n犬が脱水症状に陥ると、皮膚の緊張度が低下し、背中の皮膚をつまみ上げて離したとき、皮膚が皮膚もとの状態に戻るのに時間がかかるようになる。", "supplement": "超要約：正答。 心拍数は小型犬のほうが大型犬よりも多い。 頭をひどく振る場合、まず耳の疾患を疑う。 覚え方：『健康管理→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 74, "problem": "犬の健康管理に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "日本では狂犬病予防法で、2年に1回の狂犬病予防注射が義務づけられている。"}, {"no": 2, "text": "5、6歳齢以上になってから太ってくるのは、単なる中年太りである。"}, {"no": 3, "text": "犬糸状虫症はワクチンで確実に予防できる。"}, {"no": 4, "text": "健康な犬は毎日4~5回の排便が普通である。"}, {"no": 5, "text": "犬ジステンパーや犬パルボウイルス感染症は、ワクチンで予防できる感染症である。\n【正答】"}, {"no": 5, "text": "(2級教本第7編第4章第1節）参照。"}], "answer_no": 5, "answer_raw": "(5)", "explanation": "日本では狂犬病予防法で、1年に1回の狂犬病予防注射が義務づけられている。\n5、6歳齢以上になってから太ってくるのは、甲状腺や副腎のホルモン分泌の異常が原因のこともある。\n犬糸状虫症はワクチンでは予防できない。予防薬（駆虫薬）で予防する。\n健康な犬の排便回数は毎日1~2回。\n正答。", "supplement": "【語呂/ストーリー】『狂犬病＝犬（けん）』で名前のまんま。犬の登録と注射がセット。犬が出たらこの法律が第一候補。"}, {"q": 75, "problem": "猫を飼養するための環境作りに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "「家庭動物等の飼養及び保管に関する基準」では、「猫の所有者は、猫の健康保持の観点から、屋外飼養に努めること」と定められている。"}, {"no": 2, "text": "猫は広さのある空間を好むので、上下運動ができるように工夫するより、走り回れるような広い空間を提供したほうがよい。"}, {"no": 3, "text": "猫を車に乗せるときは、キャリーバッグに目隠しをしないほうが、猫は安心する。"}, {"no": 4, "text": "トイレの数は、猫の飼養頭数より1つ多くするのが理想的である。"}, {"no": 5, "text": "猫は快適で安心できる場所を自分で探し出すので、猫用の寝床をつくる必要はない。\n【正答】"}, {"no": 4, "text": "(2級教本第7編第4章第2節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "(1)屋内飼養に努めるとされている。\n(2)猫は上下運動を好むので、キャットタワーを設置するなど、高いところに登れるような工夫をするとよい。\n(3)目隠しをしたほうが猫は安心するといわれている。\n(4)正答。\n(5)猫の好みそうな場所に寝床をつくってやるのもよい。", "supplement": "超要約：(4)正答。 覚え方：『飼養→環境作』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 76, "problem": "猫と暮らすうえで大切なことを述べた記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "室内トイレの移動や新しい家具の搬入、聞きなれない物音などが、猫の問題行動の原因となることはない。"}, {"no": 2, "text": "初めて猫を迎え人れるときは、かまいすぎるくらいのほうがよい。"}, {"no": 3, "text": "子猫の頃から人の出入が多い環境に育った猫は、必ず人見知りをするようになる。"}, {"no": 4, "text": "生まれたての子猫の排便や排尿には、肛門や陰部を母親になめてもらう刺激が必要となる。"}, {"no": 5, "text": "離乳するまでは猫用のミルクを1日に2回程度与えるとよい。\n【正答】"}, {"no": 4, "text": "(2級教本第7編第4章第2節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "(1)環境の安定を好む猫にとっては、室内トイレの移動や新しい家具の搬入、聞き慣れない物音などが、問題行動の原因になる。\n(2)初めて猫を迎え入れるときは、犬を迎え入れるときと同じように、かまいすぎないくらいがよい。\n(3)子猫の頃から人の出入りが多い環境に育った猫は、人見知りせず訪問客を気にしないことが多い。\n(4)正答。\n(5)離乳するまでのミルクの回数は、1日4〜8回程度である。", "supplement": "超要約：(4)正答。 (5)離乳するまでのミルクの回数は、1日4〜8回程度である。 覚え方：『大切→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 77, "problem": "猫の健康管理に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 4, "text": "(2級教本第7編第4章第2節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "鼻の難治性蓄膿症では、膿性の鼻汁が特徴である。\n猫免疫不全ウイルス感染や猫白血病ウイルス感染による口内炎は難治性である。\n猫の平均体温は38~39℃である。\n正答。\n猫は犬よりも便秘症が多い。", "supplement": "超要約：鼻の難治性蓄膿症では、膿性の鼻汁が特徴である。 猫免疫不全ウイルス感染や猫白血病ウイルス感染による口内炎は難治性である。 猫の平均体温は38~39℃である。 覚え方：『健康管理→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 78, "problem": "已杞\t猫の感染症の中で、現在、日本ではワクチンが使われていないものはどれですか。次のうち、正しいものを1つ選びなさい。", "choices": [{"no": 3, "text": "(2級教本第7編第4章第2節）参照。"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "(3)正答。猫コロナウイルス感染症（猫伝染性腹膜炎＜FIP＞)のワクチンはまだ理想的なものが開発されていない。感染猫に接触させないことが唯一の予防策といえる。", "supplement": "超要約：(3)正答。猫コロナウイルス感染症（猫伝染性腹膜炎＜FIP＞)のワクチンはまだ理想的なものが開発されていない。感染猫に接触させないことが唯一の予防策といえる。 覚え方：『持ち込まない・広げない』。経路と対策（隔離/消毒/報告）をセットで。"}, {"q": 79, "problem": "鳥類に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 3, "text": "(2級教本第7編第4章第3節）参照。"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "鳥の骨は外側の皮質骨が薄く、中の空洞が広く、非常に軽量にできている。\n羽毛の色彩は、繁殖に有利なように一般的に雄のほうが色彩豊かで、雌は地味である。\n正答。\n尾脂腺は尾羽のつけ根のすぐ上に1つあり、そこから分泌される皮脂は、嘴（くちばし）を使って体全体に塗りつけることによって、雨にぬれても水をはじく防水の役割を果たす。\n胃は腺胃と筋胃の2つある。腺胃では胃酸やペプシノーゲンなどの消化酵素を分泌し、食物はそこである程度消化された後、筋胃に移動する。筋胃は筋肉質の外壁で、内部には砂などの鉱物質を蓄えており、カ強く収縮することで食物を細かく破砕する。", "supplement": "超要約：鳥の骨は外側の皮質骨が薄く、中の空洞が広く、非常に軽量にできている。 羽毛の色彩は、繁殖に有利なように一般的に雄のほうが色彩豊かで、雌は地味である。 正答。 覚え方：『鳥類→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 80, "problem": "飼い鳥の食事に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "すり餌は、動物質が原料の上餌（うわえ）と、脂質が原料の下餌（したえ）で構成される。"}, {"no": 2, "text": "種子類だけで1日に必要なビタミン・ミネラルは十分摂取できる。"}, {"no": 3, "text": "食事の基本は、その鳥種が自然界で採食しているものを与えることであるが、飼養下では食性を崩さない範囲で一般的に手に入るものを代替食物として与えることが多い。"}, {"no": 4, "text": "大型インコ・オウム類には、1日の食事量の30％程度を目安に果物類を与えたほうがよい。"}, {"no": 5, "text": "ペレットフードは副食として利用し、主食にすることはできない。\n【正答】"}, {"no": 3, "text": "(2級教本第7編第4章第3節）参照o"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "すり餌は植物質が原料の上餌と動物質が原料の下餌で構成され、原料の配合割合を変えることによって、鳥の食性に応じて幅広く利用できる。動物質の配合が多いものを強餌、少ないものを弱餌と呼ぶ。\n自然界の鳥は季節に応じて、木の芽や花粉、土、砂、岩塩など、さまざまなものを採食することで栄養のバランスを調整している。飼い鳥には主食の種子類のみでは不足しがちなミネラル類やビタミン類を補うために副食を与える必要がある。\n正答。\n大型インコ・オウム類には1日の食事量の5％以内を目安に果物類を与える。\nペレットフードは鳥の総合栄養食である。近年、これまでの種子食を主食とする食事に代わり、ペレットフードを主食とすることが理想的であると考えられるようになってきた。", "supplement": "超要約：すり餌は植物質が原料の上餌と動物質が原料の下餌で構成され、原料の配合割合を変えることによって、鳥の食性に応じて幅広く利用できる。動物質の配合が多いものを強餌、少ないものを弱餌と呼ぶ。 自然界の鳥は季節に応じて、木の芽や花粉、土、砂、岩塩など、さまざまなものを採食することで栄養のバランスを調整している。飼い鳥には主食の種子類のみでは不足しがちなミネラル類やビタミン類を補うために副食を与える必要がある。 正答。 覚え方：『食事→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 81, "problem": "飼い鳥の飼養管理に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "皮つき（殻つき）餌はむき餌に比べてカビや雑菌がつきやすく、栄養価も減少するため、できるだけむき餌を与えたほうがよい。"}, {"no": 2, "text": "病気になると、多くの場合止まり木の上や床の上で羽をふくらませてうずくまるようになるが、これは体温が上がっている状態である。"}, {"no": 3, "text": "飼養する上での適湿は一般的に40~60％であるが、熱帯、亜熱帯原産の種類は比較的低湿度を好み20~30％が適当である。"}, {"no": 4, "text": "止まり木は、太さが均一で、鳥が握ったときに前後の爪の間にすき間がなく重なるくらいのものがよい。"}, {"no": 5, "text": "鳥は病気や異常を悟られないように、相当体調が悪くても、人の気配がしたり人の姿を見たりすると、緊張して外見上元気にふるまう。\n【正答】"}, {"no": 5, "text": "(2級教本第7編第4章第3節）参照。"}], "answer_no": 5, "answer_raw": "(5)", "explanation": "(1)あらかじめ皮をむいた「むき餌」は栄養素を多く含む胚芽の部分も取り除かれており、また雑菌やカビが発生しやすいので、皮つきの飼料を与えたほうがよい。その場合、鳥がむいた皮はつねに取り除き、飼料の残掻に注意を払う必要がある。\n(2)鳥は通常39~43℃の体温を保持している。食欲不振時や疾病時には体温が急激に低下し、止まり木の上や床の上で羽をふくらませてうずくまるようになる。\n(3)熱帯・亜熱帯原産の種類は比較的高湿度を好み、60~80％が適当である。\n(4)止まり木は、太さが均一でない自然木タイプで、鳥が握ったとき前後の爪の間に少しすき間ができるくらいがよい。\n(5)正答。", "supplement": "超要約：(5)正答。 覚え方：『飼養管理→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 82, "problem": "飼い鳥の四季を通しての飼養管理に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "つがいの成鳥は、冬の日照時間の減少に伴い発情兆候が確認できるようになる。"}, {"no": 2, "text": "一般的に春と秋は繁殖の季節である。もし繁殖させる場合には巣箱の備えつけや発情飼料の給与などを始める。"}, {"no": 3, "text": "換羽は一般的に冬に行われる。"}, {"no": 4, "text": "気温が高い夏は卵秘を起こすことが多くなるので、原則的に繁殖はさせないようにする。"}, {"no": 5, "text": "羽期の食事は、羽毛が抜け始める時期は高栄養の食物を与え、生え始める頃には高栄養の食物を避けるようにする。\n【正答】"}, {"no": 2, "text": "(2級教本第7編第4章第3節）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "(1)春の日照時間の増加に伴い、つがいの成鳥は発情兆候が確認できるようになる。\n(2)正答。ただし、過剰な繁殖は鳥にとって負担となるため注意が必要である。\n(3)換羽は一般的に夏に行われる。換羽は体力を消耗させるため、健康状態を注意深く観察する必要がある。\n(4)寒冷により卵秘を起こすことが多くなるため、冬は原則的に繁殖させないようにする。\n(5)換羽をスムーズに行わせるためには、羽の抜け始めの時期には高栄養の食物を避け、安静にし、羽毛が生え始めたら高栄養の食物に切り替える。", "supplement": "超要約：(2)正答。ただし、過剰な繁殖は鳥にとって負担となるため注意が必要である。 (3)換羽は一般的に夏に行われる。換羽は体力を消耗させるため、健康状態を注意深く観察する必要がある。 (4)寒冷により卵秘を起こすことが多くなるため、冬は原則的に繁殖させないようにする。 覚え方：『四季→飼養管理』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 83, "problem": "オウム目の鳥に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 4, "text": "オウム目の鳥は、世界中広域に分布しており、ワシントン条約下で自由な国際商業取引が全種類において認められている。"}, {"no": 5, "text": "オウム目の鳥の嘴の形は、鉤型をしており、食性や採食法によって若干異なるが、第3の脚のように上手く使用することができる。\n【正答】"}, {"no": 5, "text": "(2級教本第7編第4章第3節）参照。"}], "answer_no": 5, "answer_raw": "(5)", "explanation": "(1)オウム目の鳥は、視覚、聴覚ともに発達している。\n(2)オウム目は、味覚細胞の数が多く、ほかの鳥種よりも味覚に優れているといわれる。\n(3)果食型や蜜食型の鳥を除き、一般的に鳥類は嗅覚があまり発達していない。\n(4)オウム目の鳥は、ワシントン条約下において全種が商業取引等の規制の対象となっている。\n(5)正答。", "supplement": "超要約：(5)正答。 覚え方：『絶滅しそう→売買の前に許可』＝ワシントン条約（CITES）。"}, {"q": 84, "problem": "インコ・オウム類に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "すべてのセキセイインコは、水浴びをよくするので大きめの水容器が必要である。"}, {"no": 2, "text": "大型セキセイインコは、セキセイインコとほかの鳥種を交配させて作出した新種である。"}, {"no": 3, "text": "セキセイインコは、野生では平原や林のような環境を好み、巣は樹洞に作り、家族愛が非常に強い。"}, {"no": 4, "text": "オカメインコは、性格が比較的おとなしく、寒さには非常に強い品種である。"}, {"no": 5, "text": "大型のインコに果物を与える場合、なるべく日中は避けて、寝る前に与える。\n【正答】"}, {"no": 3, "text": "(2級教本第7編第4章第3節）参照。"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "(1)セキセイインコは、水浴びをあまりしないので水容器は小さくてよいが、飼料容器は大きめのほうが適している。\n(2)大型セキセイインコは、体格の大きいセキセイインコを選択し、交配をくり返して大型化した種類である。セキセイインコに比べて頭部の張り出しが大きいのが特徴である。\n(3)正答。\n(4)オカメインコは、性格が比較的おとなしく、寒さには弱い種類なので防寒対策には特に注意する。\n(5)大型インコに果物を与える場合、1日全体の食事量の5％以内をなるべく日中に与える。生理上、寝る前に与えるのは避けたほうがよい。", "supplement": "超要約：(3)正答。 覚え方：『インコ→オウム』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 85, "problem": "フィンチに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 2, "text": "(2級教本第7編第4章第3節）参照。"}], "answer_no": 2, "answer_raw": "(2)", "explanation": "フィンチとは、スズメ目のうちホオジロ科、アトリ科、カエデチョウ科、ハタオリドリ科の4科に属し、種子類で飼養できるスズメ型の鳥のことを指す。\n正答。\nフィンチの脚指は、第1趾が後方に向き、第2、第3、第4趾が前方に向く三前趾足である。\nフィンチの嘴は、種によって太さや形状に若干の違いはみられるが、形はスズメの嘴に似た円錐型をしている。\n自然界のフィンチは、木の実や草の実などが主食であるが、昆虫類や果物類などを採食する種類もいる。", "supplement": "超要約：フィンチとは、スズメ目のうちホオジロ科、アトリ科、カエデチョウ科、ハタオリドリ科の4科に属し、種子類で飼養できるスズメ型の鳥のことを指す。 正答。 フィンチの脚指は、第1趾が後方に向き、第2、第3、第4趾が前方に向く三前趾足である。 覚え方：『フィンチ→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 86, "problem": "ジュウシマツ、ブンチョウ、カナリアに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "ジュウシマツの原種はコシジロキンパラで、オーストラリアの乾燥地帯に生息する。"}, {"no": 2, "text": "ジュウシマツやブンチョウは、止まり木で眠る習性があるので、巣は繁殖を目的とするときにだけ入れるとよい。"}, {"no": 3, "text": "ブンチョウは、繁殖が得意なので、ほかの鳥種の仮母（かぼ）になることができる。"}, {"no": 4, "text": "カナリアの品種は非常に多いが、大きく分けて「鳴きカナリア」「カラーカナリア」「スタイルカナリア」の3つに分けられる。"}, {"no": 5, "text": "カナリアは、巣の中で眠る習性があるため、普段から鳥かご内に巣を設置しておく。\n【正答】"}, {"no": 4, "text": "(2級教本第7編第4章第3節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "(1)ジュウシマツの原種は、中国南部や台湾に生息するコシジロキンバラで、森林や水田などに生息する。\n(2)ジュウシマツもブンチョウも巣の中で眠る習性があるので、常時つぼ巣を設置するが、繁殖過多の個体では、巣を取り外しておく。\n(3)ブンチョウではなく、ジュウシマツ。ジュウシマツは性格が温和で育雛（いくすう）も得意なので、体格が近いほかの鳥種の仮母（かぼ）になることができる。\n(4)正答。\n(5)カナリアは、普段止まり木で眠るため、繁殖時以外は巣を設置する必要はない。", "supplement": "超要約：(3)ブンチョウではなく、ジュウシマツ。ジュウシマツは性格が温和で育雛（いくすう）も得意なので、体格が近いほかの鳥種の仮母（かぼ）になることができる。 (4)正答。 (5)カナリアは、普段止まり木で眠るため、繁殖時以外は巣を設置する必要はない。 覚え方：『ジュウシマツ→ブンチョウ』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 87, "problem": "ニワトリ、アヒル、ハトに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 3, "text": "アヒルは、マガモを家禽化した鳥で、飛翔能力も優れている。"}, {"no": 4, "text": "アヒルなどの水禽類の腹部には、厚い皮下脂肪がついており、これにより体が水に浮かびやすくなっている。"}, {"no": 5, "text": "ハト類独特のピジョン・ミルクは、雛を育てるときに雄だけが分泌する栄養物である。\n【正答】"}, {"no": 4, "text": "(2級教本第7編第4章第3節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "(1)ニワトリの原産地はインド南東部で、現在では食肉用、採卵用、観賞用、闘鶏用など、変種を含めると約200品種のニワトリがいる。原種はセキショクヤケイで一夫多妻制である。\n(2)ニワトリは、脚が非常に強く地上を歩くのに適しているが、翼は発達しておらず、長い距離を続けて飛翔することができない。\n(3)アヒルはカモ科に属し、マガモを家禽化した鳥で飛翔能力はない。\n(4)正答。\n(5)ビジョン・ミルクとは、ハト類が雛を育てるときにつくりだす栄養物で、味嚢の内壁が肥厚して蓄積した脂肪とともにはげ落ちたものである。ピジョン・ミルクの分泌は雌雄ともにみられるハト類の特徴である。", "supplement": "超要約：(4)正答。 覚え方：『ニワトリ→アヒル』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 88, "problem": "飼い鳥の繁殖に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "性成熟の時期は、一般に体の小さい鳥種ほど遅い。"}, {"no": 2, "text": "産卵期には、フィンチもオウム目も2日おきに1卵を産卵するという特徴がある。"}, {"no": 3, "text": "抱卵中の雌は神経質になっているので、巣箱の掃除などをできるだけ頻繁に行い健康状態に留意する。"}, {"no": 4, "text": "カナリアは大きさに差がある雛を上手に育雛（いくすう）できないので、擬卵で操作する。"}, {"no": 5, "text": "交尾は通常、産卵の始まる1週間前くらいから数回行われ、産卵中に行われることはない。\n【正答】"}, {"no": 4, "text": "(2級教本第7編第4章第3節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "(1)性成熟の時期は、一般に体の大きい鳥種ほど遅い。\n(2)産卵期には、一般的にフィンチは毎日1卵ずつ産卵し、オウム目では1卵を1日おきに産卵するという特徴がある。\n(3)抱卵中の雌は極度に神経質になっているため、巣箱の中をのぞいたり衝撃などを与えたりすると抱卵を中止することがあるので巣箱の掃除などはできるだけ控える。\n(4)正答。\n(5)交尾は通常、産卵の1週間前くらいからみられ、雌が産卵する卵の数の半分を産卵するくらいまで続けられる。", "supplement": "超要約：(3)抱卵中の雌は極度に神経質になっているため、巣箱の中をのぞいたり衝撃などを与えたりすると抱卵を中止することがあるので巣箱の掃除などはできるだけ控える。 (4)正答。 覚え方：『繁殖→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 89, "problem": "手乗り鳥に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "(2級教本第7編第4章第3節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "(1)正答。\n(2)雛が羽をふくらませて丸まっていたら、体温が低下しているのでさらに温め、開口してハアハアと呼吸していれば温めすぎなので、温度を下げる。\n(3)巣から取り出したばかりの雛は、止まり木に止まれずに熱が奪われやすいので、保温器具などを利用して飼育容器の内部の温度を27~30℃に保つ必要がある。\n(4)雛に挿し餌を始めて20日くらい経つと、床にまいた食べ物を自らついばむようになるので、その後は挿し餌の回数を徐々に減らして成鳥飼料に少しずつ切り替えていく。\n(5)雛を手乗りに育てるには、ブンチョウやジュウシマツの場合は孵化後14~15日目に、小型～中型オウム目の場合は孵化後3週目前後に巣から取り出して挿し餌を始めるとよい。", "supplement": "超要約：(1)正答。 覚え方：『手乗→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 90, "problem": "小動物の分類に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 4, "text": "(2級教本第7編第4章第4節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "ウサギは齧歯目ではなく重歯目に属する。\nゴールデンハムスターとジャンガリアンハムスターは、それぞれ独立した別属別種であるため、これらの種間雑種が生まれることはない。\nモルモットは齧歯目ヤマアラシ亜目に属する動物である。\n正答。\nチンチラは、モルモットとともにヤマアラシ亜目に属するのでネズミ亜目のハムスターよりもモルモットに近縁である。", "supplement": "超要約：ウサギは齧歯目ではなく重歯目に属する。 ゴールデンハムスターとジャンガリアンハムスターは、それぞれ独立した別属別種であるため、これらの種間雑種が生まれることはない。 モルモットは齧歯目ヤマアラシ亜目に属する動物である。 覚え方：『小動物→分類』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 92, "problem": "小動物の歯に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "(2級教本第7編第4章第4節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "ウサギの歯は、切歯も臼歯も伸び続ける。\nハムスターの歯は、切歯は伸び続けるが、臼歯は伸び続けない。\n正答。\nフェレットの歯の形や構造は、犬や猫によく似ている。\nチンチラの歯は、切歯も臼歯も伸び続ける。", "supplement": ""}, {"q": 92, "problem": "小動物の食性に関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 3, "text": "(2級教本第7編第4章第4節）参照。"}], "answer_no": 3, "answer_raw": "(3)", "explanation": "(1)ウサギは、完全草食性である。\n(2)ハムスターは、草食中心の雑食性である。\n(3)正答。\n(4)フェレットは、ほぼ肉食性である。\n(5)チンチラは、ほぼ完全草食性である。", "supplement": "超要約：(3)正答。 覚え方：『小動物→食性』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 93, "problem": "ウサギに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 4, "text": "(2級教本第7編第4章第4節）参照。"}], "answer_no": 4, "answer_raw": "(4)", "explanation": "ウサギの消化管は体の大きさとの比において著しく長く、その中で特に大きい容積を占めているのは盲腸である。\nウサギの肺は小さく、肺活撮がたいへん少ない。\nウサギは元来薄明薄暮性（はくめいはくぼ）である。\n正答。ウサギの妊娠期間は29~35日である。\nウサギは巣の中で子を抱いて温めることはなく、通常181回の授乳時以外は巣に近づこうとしない。", "supplement": "超要約：ウサギの消化管は体の大きさとの比において著しく長く、その中で特に大きい容積を占めているのは盲腸である。 ウサギの肺は小さく、肺活撮がたいへん少ない。 ウサギは元来薄明薄暮性（はくめいはくぼ）である。 覚え方：『ウサギ→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 94, "problem": "ウサギに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 4, "text": "ウサギはマウンティングの動作を好んでするので、やりたいだけさせるのがよい。"}, {"no": 5, "text": "ウサギは自分で爪研ぎをして爪をすり減らすので、爪切りは不要である。\n【正答】"}, {"no": 1, "text": "(2級教本第7編第4章第4節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "(1)正答。\n(2)穀物などはウサギの盲腸に大きな負担となるので、与えないほうがよい。\n(3)ウサギの腸内環境を不安定にしないため、フードを頻繁に変えることは望ましくない。ウサギは食物に保守的であり、幼いうちについた食習慣は直らなくなってしまうことが多いため、幼いうちから正しい食生活の習慣づけが重要である。\n(4)人間に対して行うマウンティングの癖はつけさせないほうがよい。\n(5)ウサギの爪は必要に応じて切らなくてはいけない。", "supplement": "超要約：(1)正答。 (3)ウサギの腸内環境を不安定にしないため、フードを頻繁に変えることは望ましくない。ウサギは食物に保守的であり、幼いうちについた食習慣は直らなくなってしまうことが多いため、幼いうちから正しい食生活の習慣づけが重要である。 覚え方：『ウサギ→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 95, "problem": "ハムスターに関する次の記述のうち、正しいものを1つ選びなさい。", "choices": [{"no": 1, "text": "(2級教本第7編第4章第4節）参照。"}], "answer_no": 1, "answer_raw": "(1)", "explanation": "(1)正答。\n(2)正しくは逆で、ゴールデンハムスターでは雌のほうが雄より大きく、ジャンガリアンハムスターは雄のほうが雌より大きい傾向にある。\n(3)ゴールデンハムスター、ジャンガリアンハムスターともに雌の性周期は約4日サイクルであり、4日ごとに発情がみられる。\n(4)ゴールデンハムスター、ジャンガリアンハムスターともに至適温度は18~21℃と考えられている。\n(5)事故防止のため、足が挟まりにくいものや体のサイズに適した大きさのものを選ぶなどの注意が必要であるが、運動のために回し車を設置することは望ましい。", "supplement": "超要約：(1)正答。 (5)事故防止のため、足が挟まりにくいものや体のサイズに適した大きさのものを選ぶなどの注意が必要であるが、運動のために回し車を設置することは望ましい。 覚え方：『ハムスター→記述』をセット読み。選択肢で別の言葉にすり替わってたら、それが罠。"}, {"q": 96, "problem": "モルモッ
